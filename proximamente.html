<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Próximamente — Aura</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,700;1,800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--card:#171717;--card-2:#1f1f1f;
  --ink:#f5f5f5;--ink-2:#c8c8c8;--muted:#7a7a7a;--muted-2:#525252;
  --line:#262626;--line-2:#333;
  --accent:#c4ff3d;--accent-d:#a8e02f;--accent-ink:#0c0c0c;
  --r:18px;--r-sm:12px;
  --sans:'Plus Jakarta Sans',-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14px;min-height:100vh;}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:2px;}

.main{display:flex;flex-direction:column;gap:14px;min-width:0;padding:12px 0;}

/* TOPBAR */
.topbar{display:flex;align-items:center;gap:14px;height:64px;flex-shrink:0;padding:0 4px;}
.tb-crumb{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--muted);flex-shrink:0;}
.tb-crumb .sep{color:var(--line-2);}
.tb-crumb .end{color:var(--accent);font-weight:700;}
.tb-spacer{flex:1;}
.tb-back{display:flex;align-items:center;gap:9px;background:var(--card);padding:9px 16px 9px 12px;border-radius:999px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);transition:.16s;margin-right:20px;}
.tb-back:hover{color:var(--accent);}
.tb-back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}

/* COMING SOON */
.cs{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;position:relative;overflow:hidden;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:56px 32px;min-height:calc(100vh - 110px);
}
.cs::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,transparent 0,transparent 16px,rgba(196,255,61,.018) 16px,rgba(196,255,61,.018) 17px);pointer-events:none;}
.cs::after{content:"";position:absolute;inset:0;background:radial-gradient(620px 420px at 50% 38%,rgba(196,255,61,.10),transparent 62%);pointer-events:none;}
.cs-in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;max-width:600px;}

.cs-node{
  width:108px;height:108px;border-radius:30px;display:flex;align-items:center;justify-content:center;
  background:var(--accent);color:var(--accent-ink);position:relative;margin-bottom:30px;
  box-shadow:0 0 50px rgba(196,255,61,.4);
}
.cs-node svg{width:50px;height:50px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;}
.cs-node::after{content:"";position:absolute;inset:-9px;border-radius:38px;border:1.5px solid rgba(196,255,61,.4);animation:pulse 2.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.6;transform:scale(1);}50%{opacity:0;transform:scale(1.13);}}

.cs-tag{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.22em;text-transform:uppercase;display:flex;align-items:center;gap:9px;margin-bottom:18px;}
.cs-tag::before,.cs-tag::after{content:"";width:24px;height:1px;background:linear-gradient(90deg,transparent,var(--accent));}
.cs-tag::after{background:linear-gradient(90deg,var(--accent),transparent);}

.cs h1{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;line-height:1.14;color:var(--ink);padding-bottom:.08em;text-wrap:balance;}
.cs h1 em{font-style:italic;color:var(--accent);font-weight:700;}
.cs .feat{display:block;font-family:var(--mono);font-size:13px;color:var(--ink-2);letter-spacing:.04em;margin-top:14px;}
.cs .feat b{color:var(--accent);}
.cs p{font-size:15px;color:var(--muted);line-height:1.6;margin-top:14px;max-width:420px;text-wrap:pretty;}

.cs-prog{display:flex;align-items:center;gap:12px;margin-top:28px;width:300px;max-width:80vw;}
.cs-prog .track{flex:1;height:8px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden;border:1px solid var(--line);}
.cs-prog .fill{height:100%;width:64%;border-radius:999px;background:linear-gradient(90deg,var(--accent-d),var(--accent));box-shadow:0 0 10px rgba(196,255,61,.5);position:relative;overflow:hidden;}
.cs-prog .fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-100%);animation:shimmer 2s ease-in-out infinite;}
@keyframes shimmer{to{transform:translateX(220%);}}
.cs-prog .pct{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent);}

.cs-actions{display:flex;align-items:center;gap:12px;margin-top:34px;flex-wrap:wrap;justify-content:center;}
.cs-btn{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:15px 26px;border-radius:13px;transition:.18s;}
.cs-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
.cs-btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 30px rgba(196,255,61,.28);}
.cs-btn.primary:hover{background:#fff;transform:translateY(-2px);}
.cs-btn.ghost{background:rgba(255,255,255,.04);border:1px solid var(--line-2);color:var(--ink-2);}
.cs-btn.ghost:hover{color:var(--ink);border-color:var(--muted);background:rgba(255,255,255,.07);}

.cs-note{margin-top:30px;font-family:var(--mono);font-size:10px;color:var(--muted-2);letter-spacing:.14em;text-transform:uppercase;}
.cs-note b{color:var(--muted);}

@media(max-width:620px){
  .cs h1{font-size:2.1rem;}
  .cs{padding:40px 22px;}
  .cs-node{width:88px;height:88px;}
  .cs-node svg{width:40px;height:40px;}
  .tb-crumb{display:none;}
}
</style>
</head>
<body style="padding-left:86px;padding-right:86px;">

<main class="main">

  <div class="topbar">
    <div class="tb-crumb"><span>aura</span><span class="sep">/</span><span class="end" id="crumb">próximamente</span></div>
    <div class="tb-spacer"></div>
    <a class="tb-back" href="#" id="back"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> Volver</a>
  </div>

  <section class="cs">
    <div class="cs-in">
      <div class="cs-node">
        <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      </div>
      <div class="cs-tag">en construcción</div>
      <h1>Esto llega <em>pronto</em></h1>
      <span class="feat" id="feat">Estamos puliendo <b>esta función</b> para ti.</span>
      <p id="desc">Nuestro equipo está afinando los últimos detalles. Vuelve en unos días y la tendrás lista para usar.</p>

      <div class="cs-prog">
        <span class="pct">EN PROGRESO</span>
        <div class="track"><div class="fill"></div></div>
        <span class="pct">64%</span>
      </div>

      <div class="cs-actions">
        <button class="cs-btn primary" onclick="auraNav('dashboard.html')">Ir al dashboard <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
        <a class="cs-btn ghost" href="#" id="back2"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> Volver atrás</a>
      </div>

      <div class="cs-note">aura · seguimos <b>construyendo</b> tu camino</div>
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="aura-supabase.js"></script>
<script src="aura-shell.js?v=3"></script>
<script>
/* Personaliza el mensaje según ?feature=Nombre (opcional).
   Ej: proximamente.html?feature=Tienda  */
var params = new URLSearchParams(location.search);
var feature = params.get('feature');
if(feature){
  document.getElementById('crumb').textContent = feature.toLowerCase();
  document.getElementById('feat').innerHTML = 'Estamos puliendo <b>' + feature + '</b> para ti.';
  document.title = feature + ' — Próximamente · Aura';
}

/* Botones "Volver" */
function goBack(e){
  e.preventDefault();
  if(history.length > 1){ history.back(); }
  else{ window.location.href = 'dashboard.html'; }
}
document.getElementById('back').addEventListener('click', goBack);
document.getElementById('back2').addEventListener('click', goBack);
</script>

</body>
</html>

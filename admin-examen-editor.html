<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor Examen de Ascenso — Aura Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0916;--card:#161329;--card2:#1e1b3a;--card3:#0f0d1e;
  --ink:#f0eeff;--ink2:#b8b0d8;--muted:#6b6485;
  --line:#2a2548;--line2:#3d3660;
  --accent:#c4ff3d;--accent-d:#a8e02f;--accent-ink:#0c180a;
  --good:#7BE37B;--bad:#ff5a5a;--warn:#fbbf24;
  --c-listen:#7CB2FF;--c-read:#A78BFA;--c-vocab:#5BE9F6;
  --c-phrasal:#FFD83D;--c-slang:#FF5AC4;--c-write:#7BE37B;--c-speak:#FF8A5A;
  --bronze:#cd7f32;--silver:#d1d5db;--gold:#fbbf24;
  --platinum:#5eead4;--diamond:#60a5fa;--challenger:#c4ff3d;
  --r:16px;--sans:'Plus Jakarta Sans',-apple-system,sans-serif;--mono:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14px;
  min-height:100vh;display:flex;
  background:radial-gradient(900px 600px at 70% 0%,rgba(164,120,255,.07),transparent 60%),
    radial-gradient(600px 400px at 5% 100%,rgba(124,178,255,.05),transparent 60%),#0a0916;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;}
a{color:inherit;text-decoration:none;}
textarea,input,select{font:inherit;color:inherit;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px;}
::-webkit-scrollbar-track{background:transparent;}

/* ── LAYOUT ── */
.shell{display:flex;width:100%;min-height:100vh;}

/* ── SIDEBAR ── */
.sidebar{
  width:264px;flex-shrink:0;
  background:var(--card);
  border-right:1px solid var(--line);
  padding:20px 16px;
  position:sticky;top:0;align-self:flex-start;
  max-height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:20px;
}
.sb-brand{display:flex;align-items:center;gap:10px;padding:0 2px;}
.sb-logo{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,#c4ff3d,#a8e02f);
  color:#0c180a;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:15px;box-shadow:0 4px 14px rgba(196,255,61,.3);
}
.sb-title b{display:block;font-size:13px;font-weight:800;letter-spacing:-.01em;}
.sb-title span{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;}

.sb-section{display:flex;flex-direction:column;gap:6px;}
.sb-label{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:0 4px;}

/* ── RANK TABS ── */
.rank-tabs{display:flex;flex-direction:column;gap:4px;}
.rank-tab{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:12px;
  cursor:pointer;transition:.15s;
  border:1px solid transparent;
  position:relative;
}
.rank-tab:hover{background:var(--card2);}
.rank-tab.active{background:var(--card2);border-color:var(--line2);}
.rank-tab-pip{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.rank-tab-info{flex:1;min-width:0;}
.rank-tab-name{font-size:12px;font-weight:700;letter-spacing:-.01em;}
.rank-tab-cefr{font-family:var(--mono);font-size:9px;color:var(--muted);}
.rank-dots{display:flex;gap:3px;flex-shrink:0;}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--line2);transition:.2s;
}
.dot.done{background:var(--good);}
.dot.partial{background:var(--warn);}

/* ── SCORE INPUT ── */
.score-row{
  display:flex;align-items:center;gap:8px;
  background:var(--card2);border-radius:12px;
  padding:10px 14px;border:1px solid var(--line);
}
.score-row label{font-size:11px;color:var(--ink2);font-weight:600;flex:1;}
.score-input{
  width:52px;padding:4px 8px;
  background:var(--card3);border:1px solid var(--line2);
  border-radius:8px;font-family:var(--mono);font-size:13px;font-weight:700;
  color:var(--accent);text-align:center;outline:none;
}
.score-input:focus{border-color:var(--accent);}

/* ── LANG SELECTOR ── */
.lang-sel{
  width:100%;padding:8px 12px;
  background:var(--card2);border:1px solid var(--line);
  border-radius:10px;font-size:12px;font-weight:600;
  color:var(--ink2);outline:none;cursor:pointer;
}
.lang-sel:focus{border-color:var(--line2);}

.sb-db-status{
  font-family:var(--mono);font-size:9px;color:var(--muted);
  padding:0 4px;
}

/* ── PUBLISH BUTTON ── */
.btn-publish{
  width:100%;padding:11px 16px;
  background:linear-gradient(135deg,#c4ff3d,#a8e02f);
  color:var(--accent-ink);border-radius:12px;
  font-size:13px;font-weight:800;letter-spacing:-.01em;
  transition:.15s;box-shadow:0 4px 18px rgba(196,255,61,.2);
}
.btn-publish:hover{box-shadow:0 6px 24px rgba(196,255,61,.35);transform:translateY(-1px);}
.btn-preview{
  width:100%;padding:9px 16px;
  background:transparent;border:1px solid var(--line2);
  color:var(--ink2);border-radius:12px;
  font-size:12px;font-weight:600;transition:.15s;
}
.btn-preview:hover{background:var(--card2);color:var(--ink);}

/* ── MAIN ── */
.main{flex:1;padding:28px 32px;min-width:0;max-width:900px;}

.main-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:24px;
  gap:16px;
}
.version-badge{
  display:flex;align-items:center;gap:12px;
}
.version-pip{
  width:12px;height:12px;border-radius:50%;
  box-shadow:0 0 10px currentColor;
}
.version-title{font-size:22px;font-weight:800;letter-spacing:-.03em;}
.version-cefr{
  font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);
}
.db-badge{
  font-family:var(--mono);font-size:9px;
  background:var(--card2);border:1px solid var(--line);
  padding:4px 10px;border-radius:20px;color:var(--muted);
}

/* ── SECTION CARDS ── */
.sections{display:flex;flex-direction:column;gap:10px;}

.sec-card{
  background:var(--card);border:1px solid var(--line);
  border-radius:16px;overflow:hidden;
  transition:.15s;
}
.sec-card.open{border-color:var(--line2);}

.sec-head{
  display:flex;align-items:center;gap:12px;
  padding:14px 18px;cursor:pointer;
  transition:.15s;
}
.sec-head:hover{background:rgba(255,255,255,.02);}
.sec-icon{
  width:32px;height:32px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.sec-name{font-size:13px;font-weight:700;letter-spacing:-.01em;}
.sec-sub{font-size:10px;color:var(--muted);font-weight:500;}
.sec-status{
  margin-left:auto;font-family:var(--mono);font-size:9px;
  padding:3px 9px;border-radius:20px;font-weight:700;
  background:var(--card2);color:var(--muted);border:1px solid var(--line);
}
.sec-status.has-content{background:rgba(123,227,123,.12);color:var(--good);border-color:rgba(123,227,123,.25);}
.sec-chevron{font-size:10px;color:var(--muted);margin-left:8px;transition:.2s;}
.sec-card.open .sec-chevron{transform:rotate(180deg);}

.sec-body{
  display:none;
  padding:0 18px 18px;
  border-top:1px solid var(--line);
}
.sec-card.open .sec-body{display:block;}

/* ── FIELD STYLES ── */
.field{margin-top:14px;}
.field-label{
  font-family:var(--mono);font-size:9px;
  color:var(--muted);letter-spacing:.14em;
  text-transform:uppercase;font-weight:700;
  margin-bottom:6px;
}
.field-ta{
  width:100%;min-height:100px;
  background:var(--card2);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;
  font-family:var(--mono);font-size:12px;
  color:var(--ink);line-height:1.6;resize:vertical;outline:none;
  transition:.15s;
}
.field-ta:focus{border-color:var(--line2);}
.field-ta.json{min-height:140px;}
.field-in{
  width:100%;padding:8px 12px;
  background:var(--card2);border:1px solid var(--line);
  border-radius:10px;font-size:13px;color:var(--ink);outline:none;transition:.15s;
}
.field-in:focus{border-color:var(--line2);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

.hint-box{
  margin-top:8px;padding:8px 12px;
  background:rgba(196,255,61,.04);border:1px solid rgba(196,255,61,.1);
  border-radius:8px;font-family:var(--mono);font-size:10px;
  color:#8a9c4a;line-height:1.7;
}
.hint-box b{color:var(--accent);}

/* ── MEDIA PICKER BTN ── */
.btn-media{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:10px;
  background:rgba(124,178,255,.1);border:1px solid rgba(124,178,255,.2);
  color:#7CB2FF;font-size:11px;font-weight:700;
  transition:.15s;margin-top:10px;
}
.btn-media:hover{background:rgba(124,178,255,.18);border-color:rgba(124,178,255,.4);}
.media-preview{
  display:flex;align-items:center;gap:10px;
  margin-top:10px;padding:10px 12px;
  background:var(--card2);border:1px solid var(--line);
  border-radius:10px;
}
.media-thumb{
  width:48px;height:32px;border-radius:6px;
  object-fit:cover;background:var(--card3);flex-shrink:0;
}
.media-info{flex:1;min-width:0;}
.media-title{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.media-type{font-family:var(--mono);font-size:9px;color:var(--muted);}
.media-clear{font-size:18px;color:var(--muted);cursor:pointer;flex-shrink:0;padding:2px;}
.media-clear:hover{color:var(--bad);}

.sec-save-row{
  display:flex;align-items:center;gap:8px;
  margin-top:16px;padding-top:14px;
  border-top:1px solid var(--line);
}
.btn-sec-save{
  padding:8px 18px;border-radius:10px;
  background:var(--accent);color:var(--accent-ink);
  font-size:12px;font-weight:800;transition:.15s;
}
.btn-sec-save:hover{background:var(--accent-d);}
.btn-sec-del{
  padding:8px 14px;border-radius:10px;
  background:rgba(255,90,90,.1);border:1px solid rgba(255,90,90,.2);
  color:var(--bad);font-size:12px;font-weight:700;transition:.15s;
}
.btn-sec-del:hover{background:rgba(255,90,90,.2);}
.sec-save-note{font-size:10px;color:var(--muted);margin-left:auto;}

/* ── MODAL BASE ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(10,9,22,.85);
  backdrop-filter:blur(6px);z-index:1000;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:.2s;
}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{
  background:var(--card);border:1px solid var(--line2);
  border-radius:20px;padding:24px;
  width:620px;max-width:95vw;max-height:86vh;
  overflow-y:auto;
  transform:translateY(8px);transition:.2s;
}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;
}
.modal-title{font-size:16px;font-weight:800;letter-spacing:-.02em;}
.modal-close{
  width:28px;height:28px;border-radius:7px;
  background:var(--card2);color:var(--ink2);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:.15s;
}
.modal-close:hover{background:var(--line2);}

/* ── MEDIA MODAL ── */
.media-tabs{display:flex;gap:6px;margin-bottom:14px;}
.media-tab-btn{
  padding:6px 14px;border-radius:8px;
  font-size:11px;font-weight:700;
  background:var(--card2);color:var(--muted);
  border:1px solid var(--line);transition:.15s;
}
.media-tab-btn.active{background:rgba(196,255,61,.12);color:var(--accent);border-color:rgba(196,255,61,.3);}
.media-search{
  width:100%;padding:8px 12px;margin-bottom:12px;
  background:var(--card2);border:1px solid var(--line);
  border-radius:10px;font-size:12px;color:var(--ink);outline:none;
}
.media-search:focus{border-color:var(--line2);}
.media-list{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto;}
.media-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:10px;
  background:var(--card2);border:1px solid transparent;
  cursor:pointer;transition:.15s;
}
.media-item:hover{border-color:var(--line2);}
.media-item.selected{border-color:var(--accent);background:rgba(196,255,61,.06);}
.mi-thumb{width:52px;height:34px;border-radius:6px;object-fit:cover;background:var(--card3);flex-shrink:0;}
.mi-info{flex:1;min-width:0;}
.mi-title{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mi-sub{font-family:var(--mono);font-size:9px;color:var(--muted);}
.mi-check{
  width:18px;height:18px;border-radius:5px;
  background:rgba(196,255,61,.15);border:1.5px solid rgba(196,255,61,.3);
  display:flex;align-items:center;justify-content:center;
  font-size:9px;color:var(--accent);flex-shrink:0;
  opacity:0;transition:.15s;
}
.media-item.selected .mi-check{opacity:1;}
.media-modal-footer{
  display:flex;gap:8px;margin-top:14px;
  padding-top:14px;border-top:1px solid var(--line);
}
.btn-media-confirm{
  flex:1;padding:9px;border-radius:10px;
  background:var(--accent);color:var(--accent-ink);
  font-size:12px;font-weight:800;transition:.15s;
}
.btn-media-confirm:hover{background:var(--accent-d);}
.btn-media-cancel{
  padding:9px 16px;border-radius:10px;
  background:var(--card2);color:var(--ink2);
  font-size:12px;font-weight:600;border:1px solid var(--line);
}

/* ── PREVIEW MODAL ── */
.preview-frame{
  width:100%;height:500px;border-radius:12px;
  border:1px solid var(--line);background:var(--card3);
}
.preview-modal .modal{width:860px;max-width:96vw;}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--card2);border:1px solid var(--line2);
  color:var(--ink);padding:10px 20px;border-radius:12px;
  font-size:13px;font-weight:600;
  transition:.25s;z-index:9000;
  box-shadow:0 8px 30px rgba(0,0,0,.4);
  opacity:0;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
</style>
</head>
<body>
<div class="shell">

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sb-brand">
    <div class="sb-logo">A</div>
    <div class="sb-title">
      <b>Editor Examen</b>
      <span>Admin · Aura</span>
    </div>
  </div>

  <div class="sb-section">
    <div class="sb-label">Idioma</div>
    <select class="lang-sel" id="adm-lang" onchange="onLangChange()">
      <option value="en">🇺🇸 English</option>
      <option value="es">🇪🇸 Español</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="it">🇮🇹 Italiano</option>
      <option value="pt">🇧🇷 Português</option>
    </select>
  </div>

  <div class="sb-section">
    <div class="sb-label">Versión del Examen</div>
    <div class="rank-tabs" id="rankTabs">
      <!-- JS rendered -->
    </div>
  </div>

  <div class="sb-section">
    <div class="sb-label">Puntaje mínimo</div>
    <div class="score-row">
      <label id="score-label">Para pasar de Bronce</label>
      <input class="score-input" id="score-input" type="number" min="0" max="100" value="70" onchange="saveScore()">
      <span style="font-family:var(--mono);font-size:11px;color:var(--muted);">%</span>
    </div>
  </div>

  <div class="sb-section" style="margin-top:auto;gap:8px;">
    <button class="btn-preview" onclick="openPreview()">👁 Vista previa</button>
    <button class="btn-publish" onclick="publishVersion()">🚀 Publicar versión</button>
  </div>

  <div class="sb-db-status" id="adm-db-status">—</div>
</aside>

<!-- MAIN -->
<main class="main">
  <div class="main-header">
    <div class="version-badge">
      <div class="version-pip" id="versionPip" style="color:#cd7f32;background:#cd7f32;"></div>
      <div>
        <div class="version-title" id="versionTitle">Bronce → Plata</div>
        <div class="version-cefr" id="versionCefr">A1 → A2</div>
      </div>
    </div>
    <div class="db-badge" id="db-badge">0 secciones guardadas</div>
  </div>

  <div class="sections" id="sections">
    <!-- Generado por JS -->
  </div>
</main>

</div><!-- .shell -->

<!-- MODAL MEDIA PICKER -->
<div class="modal-overlay" id="mediaModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="mediaModalTitle">Seleccionar material audiovisual</div>
      <button class="modal-close" onclick="closeModal('mediaModal')">✕</button>
    </div>
    <div class="media-tabs">
      <button class="media-tab-btn active" id="mtab-movies" onclick="setMediaTab('movies')">🎬 Películas/Series</button>
      <button class="media-tab-btn" id="mtab-songs" onclick="setMediaTab('songs')">🎵 Canciones</button>
    </div>
    <input class="media-search" id="mediaSearch" placeholder="Buscar..." oninput="filterMedia()">
    <div class="media-list" id="mediaList">
      <div style="text-align:center;padding:24px;color:var(--muted);font-size:12px;">Cargando...</div>
    </div>
    <div class="media-modal-footer">
      <button class="btn-media-cancel" onclick="closeModal('mediaModal')">Cancelar</button>
      <button class="btn-media-confirm" onclick="confirmMedia()">✓ Seleccionar</button>
    </div>
  </div>
</div>

<!-- MODAL PREVIEW -->
<div class="modal-overlay preview-modal" id="previewModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">Vista previa del examen</div>
      <button class="modal-close" onclick="closeModal('previewModal')">✕</button>
    </div>
    <iframe class="preview-frame" id="previewFrame" src="about:blank"></iframe>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="aura-supabase.js"></script>
<script>

];

var JSON_TEMPLATES = {
  listen:  '{\n  "scene_id": null,\n  "song_id": null,\n  "media_type": "movie",\n  "cloze": {\n    "sentence": "I can\'t believe you _____ me like that.",\n    "blank": "treated",\n    "opts": ["treated","spoke","left","hurt"]\n  },\n  "mc": {\n    "question": "What is the speaker\'s tone?",\n    "opts": ["Angry","Sad","Sarcastic","Neutral"],\n    "correct": 0,\n    "tag": "Tone · A1"\n  }\n}',
  read:    '{\n  "title": "My Daily Routine",\n  "passage": "Every morning I wake up at 7 o\'clock...",\n  "tf": [\n    {"s": "The writer wakes up at 7.", "ans": true},\n    {"s": "The writer has coffee first.", "ans": false}\n  ],\n  "match": [\n    {"tag": "morning", "def": "the early part of the day"},\n    {"tag": "routine", "def": "a regular set of activities"}\n  ]\n}',
  vocab:   '{\n  "word": "Nervous",\n  "ipa": "/ˈnɜː.vəs/",\n  "pos": "adjective",\n  "rating": 3,\n  "color": "#7CB2FF",\n  "chip": "A2 · Emotions",\n  "opts": ["Worried and anxious","Brave and bold","Happy and excited"],\n  "correct": 0,\n  "family": ["nervously","nervousness","nerve","unnerving"]\n}',
  phrasal: '{\n  "cards": [\n    {"s": "I need to ___ smoking.", "blank": "give up", "reg": "informal", "cefr": "A2",\n     "opts": ["give up","find out","turn on"],"correct":0},\n    {"s": "Can you ___ after my cat?", "blank": "look", "reg": "everyday", "cefr": "A2",\n     "opts": ["look","get","take"],"correct":0}\n  ]\n}',
  slang:   '{\n  "cards": [\n    {"expr": "Hang out", "reg": "informal · social", "def": "To spend time with friends casually"},\n    {"expr": "Chill", "reg": "adjective · slang", "def": "Relaxed, easy-going"}\n  ]\n}',
  write:   '{\n  "prompt": "Describe your daily routine. Include what you do in the morning, afternoon and evening.",\n  "style": "Narrative · personal",\n  "min_words": 50,\n  "max_words": 80,\n  "reg": "Informal / personal",\n  "structure": "3 párrafos: morning, afternoon, evening"\n}',
  speak:   '{\n  "text": "Every morning I wake up at seven o\'clock.",\n  "ipa": "/ˈev.ri ˈmɔː.nɪŋ/",\n  "prompt": "Talk about your morning routine. Speak for 30 seconds.",\n  "time": 30\n}',
};

// ─── STATE ────────────────────────────────────────────────────
var _curV = 1;
var _lang = 'en';
var _dbData = {};   // _dbData[rank][skill] = {id, content, ...}
var _mediaTarget = null;   // which skill is picking media
var _mediaTab = 'movies';
var _allMovies = [];
var _allSongs = [];
var _selectedMedia = null;
var _scores = {};  // _scores[rank] = number

// ─── INIT ────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  var lang = localStorage.getItem('aura_lang') || 'en';
  document.getElementById('adm-lang').value = lang;
  _lang = lang;
  renderRankTabs();
  renderSections();
  setVersion(1);
  loadAllVersionsFromDB();
});

function onLangChange() {
  _lang = document.getElementById('adm-lang').value;
  loadAllVersionsFromDB();
}

// ─── RENDER RANK TABS ─────────────────────────────────────────
function renderRankTabs() {
  var el = document.getElementById('rankTabs');
  el.innerHTML = VERSIONS.map(function(vd) {
    return '<div class="rank-tab" id="rtab-'+vd.v+'" onclick="setVersion('+vd.v+')">' +
      '<div class="rank-tab-pip" style="background:'+vd.color+';box-shadow:0 0 6px '+vd.color+'80;"></div>' +
      '<div class="rank-tab-info">' +
        '<div class="rank-tab-name" style="color:'+vd.color+'">'+vd.from+' → '+vd.to+'</div>' +
        '<div class="rank-tab-cefr">'+vd.cefr+'</div>' +
      '</div>' +
      '<div class="rank-dots" id="rdots-'+vd.v+'">' +
        SECTIONS.map(function(){return '<div class="dot"></div>';}).join('') +
      '</div>' +
    '</div>';
  }).join('');
}

// ─── SET VERSION ─────────────────────────────────────────────
function setVersion(v) {
  _curV = v;
  var vd = VERSIONS[v-1];
  // update tabs
  VERSIONS.forEach(function(x) {
    document.getElementById('rtab-'+x.v).classList.toggle('active', x.v===v);
  });
  // update header
  document.getElementById('versionPip').style.background = vd.color;
  document.getElementById('versionPip').style.color = vd.color;
  document.getElementById('versionTitle').textContent = vd.from + ' → ' + vd.to;
  document.getElementById('versionCefr').textContent = vd.cefr;
  document.getElementById('score-label').textContent = 'Para pasar de ' + vd.from;
  // load score
  document.getElementById('score-input').value = _scores[vd.rank] || 70;
  // re-render sections with saved data
  renderSections();
  populateSectionData();
  updateDBBadge();
}

// ─── RENDER SECTIONS ─────────────────────────────────────────
function renderSections() {
  var el = document.getElementById('sections');
  el.innerHTML = SECTIONS.map(function(sec) {
    var hasMedia = sec.key === 'listen' || sec.key === 'speak';
    var mediaHtml = hasMedia ?
      '<button class="btn-media" onclick="openMediaPicker(\''+sec.key+'\')">🎬 Seleccionar material audiovisual</button>' +
      '<div class="media-preview" id="mp-'+sec.key+'" style="display:none;">' +
        '<img class="media-thumb" id="mp-thumb-'+sec.key+'" src="" alt="">' +
        '<div class="media-info">' +
          '<div class="media-title" id="mp-title-'+sec.key+'">—</div>' +
          '<div class="media-type" id="mp-type-'+sec.key+'">—</div>' +
        '</div>' +
        '<span class="media-clear" onclick="clearMedia(\''+sec.key+'\')">✕</span>' +
      '</div>' : '';

    return '<div class="sec-card" id="sc-'+sec.key+'">' +
      '<div class="sec-head" onclick="toggleSection(\''+sec.key+'\')">' +
        '<div class="sec-icon" style="background:rgba(var(--_c),0.12);">' + sec.icon + '</div>' +
        '<div>' +
          '<div class="sec-name">'+sec.label+'</div>' +
          '<div class="sec-sub">'+sec.desc+'</div>' +
        '</div>' +
        '<div class="sec-status" id="ss-'+sec.key+'">Sin contenido</div>' +
        '<span class="sec-chevron">▼</span>' +
      '</div>' +
      '<div class="sec-body">' +
        mediaHtml +
        '<div class="field">' +
          '<div class="field-label">Contenido JSON</div>' +
          '<textarea class="field-ta json" id="fta-'+sec.key+'" spellcheck="false" placeholder="'+sec.key+'..."></textarea>' +
          '<div class="hint-box"><b>Plantilla:</b><br>' + escHtml(JSON_TEMPLATES[sec.key]) + '</div>' +
        '</div>' +
        '<div class="sec-save-row">' +
          '<button class="btn-sec-save" onclick="saveSection(\''+sec.key+'\')">💾 Guardar sección</button>' +
          '<button class="btn-sec-del" onclick="deleteSection(\''+sec.key+'\')">🗑 Borrar</button>' +
          '<span class="sec-save-note" id="sn-'+sec.key+'"></span>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleSection(key) {
  var card = document.getElementById('sc-'+key);
  card.classList.toggle('open');
}

// ─── POPULATE SECTION DATA FROM _dbData ──────────────────────
function populateSectionData() {
  var vd = VERSIONS[_curV-1];
  var rank = vd.rank;
  SECTIONS.forEach(function(sec) {
    var ta = document.getElementById('fta-'+sec.key);
    var row = _dbData[rank] && _dbData[rank][sec.key];
    if (row && row.content) {
      ta.value = typeof row.content === 'string' ? row.content : JSON.stringify(row.content, null, 2);
      setSecStatus(sec.key, true, row.updated_at);
      // restore media preview
      if (row.content && (sec.key==='listen'||sec.key==='speak')) {
        var c = typeof row.content === 'object' ? row.content : tryParse(row.content);
        if (c && (c.media_title || c.scene_id || c.song_id)) {
          showMediaPreview(sec.key, c.media_title||'Material guardado', c.media_type||'—', c.media_thumb||'');
        }
      }
    } else {
      ta.value = '';
      setSecStatus(sec.key, false, null);
      clearMedia(sec.key);
    }
  });
}

function tryParse(s) { try { return JSON.parse(s); } catch(e) { return null; } }

function setSecStatus(key, has, date) {
  var el = document.getElementById('ss-'+key);
  if (has) {
    el.textContent = '✓ Guardado' + (date ? ' · ' + new Date(date).toLocaleDateString() : '');
    el.className = 'sec-status has-content';
  } else {
    el.textContent = 'Sin contenido';
    el.className = 'sec-status';
  }
}

// ─── LOAD FROM DB ────────────────────────────────────────────
function loadAllVersionsFromDB() {
  var status = document.getElementById('adm-db-status');
  status.textContent = 'Cargando…';
  _sb.from('exam_content')
    .select('id,section,rank,language,content,difficulty,active,updated_at')
    .eq('language', _lang)
    .then(function(r) {
      if (r.error) { status.textContent = '❌ Error'; return; }
      _dbData = {};
      (r.data || []).forEach(function(row) {
        if (!_dbData[row.rank]) _dbData[row.rank] = {};
        _dbData[row.rank][row.section] = row;
      });
      var total = r.data ? r.data.length : 0;
      status.textContent = total + ' secciones en BD';
      populateSectionData();
      updateAllDots();
      updateDBBadge();
    });
}

function updateAllDots() {
  VERSIONS.forEach(function(vd) {
    var dots = document.querySelectorAll('#rdots-'+vd.v+' .dot');
    SECTIONS.forEach(function(sec, i) {
      var has = _dbData[vd.rank] && _dbData[vd.rank][sec.key];
      if (dots[i]) dots[i].className = 'dot' + (has ? ' done' : '');
    });
  });
}

function updateDBBadge() {
  var vd = VERSIONS[_curV-1];
  var n = 0;
  if (_dbData[vd.rank]) n = Object.keys(_dbData[vd.rank]).length;
  document.getElementById('db-badge').textContent = n + ' / 7 secciones guardadas';
}

// ─── SAVE SECTION ────────────────────────────────────────────
function saveSection(key) {
  var vd = VERSIONS[_curV-1];
  var ta = document.getElementById('fta-'+key);
  var raw = ta.value.trim();
  if (!raw) { toast('⚠ El contenido está vacío'); return; }
  var content;
  try { content = JSON.parse(raw); }
  catch(e) { toast('❌ JSON inválido — revisa la sintaxis'); return; }

  // inject media info if present
  var savedMedia = _getMediaForSkill(key);
  if (savedMedia) Object.assign(content, savedMedia);

  var row = { section: key, rank: vd.rank, language: _lang, content: content, active: true };
  var existing = _dbData[vd.rank] && _dbData[vd.rank][key];
  var p = existing
    ? _sb.from('exam_content').update(row).eq('id', existing.id).select()
    : _sb.from('exam_content').insert([row]).select();

  p.then(function(r) {
    if (r.error) { toast('❌ ' + r.error.message); return; }
    var saved = r.data && r.data[0];
    if (!_dbData[vd.rank]) _dbData[vd.rank] = {};
    _dbData[vd.rank][key] = saved || row;
    if (saved) _dbData[vd.rank][key].updated_at = saved.updated_at;
    setSecStatus(key, true, saved && saved.updated_at);
    updateAllDots();
    updateDBBadge();
    var note = document.getElementById('sn-'+key);
    note.textContent = 'Guardado ' + new Date().toLocaleTimeString();
    toast('✓ Sección "' + key + '" guardada');
  });
}

// ─── DELETE SECTION ──────────────────────────────────────────
function deleteSection(key) {
  var vd = VERSIONS[_curV-1];
  var existing = _dbData[vd.rank] && _dbData[vd.rank][key];
  if (!existing) { toast('⚠ Sin datos en BD para esta sección'); return; }
  if (!confirm('¿Eliminar sección ' + key + ' de ' + vd.from + '?')) return;
  _sb.from('exam_content').delete().eq('id', existing.id).then(function(r) {
    if (r.error) { toast('❌ ' + r.error.message); return; }
    delete _dbData[vd.rank][key];
    setSecStatus(key, false, null);
    document.getElementById('fta-'+key).value = '';
    clearMedia(key);
    updateAllDots();
    updateDBBadge();
    toast('✓ Eliminado');
  });
}

// ─── MINIMUM SCORE ────────────────────────────────────────────
function saveScore() {
  var vd = VERSIONS[_curV-1];
  var val = parseInt(document.getElementById('score-input').value) || 70;
  _scores[vd.rank] = val;
  // persist to exam_meta table or localStorage as fallback
  try { localStorage.setItem('aura_exam_scores', JSON.stringify(_scores)); } catch(e){}
  toast('✓ Puntaje mínimo: ' + val + '%');
}

// load saved scores
(function() {
  try {
    var s = localStorage.getItem('aura_exam_scores');
    if (s) _scores = JSON.parse(s);
  } catch(e){}
})();

// ─── MEDIA PICKER ────────────────────────────────────────────
function openMediaPicker(skill) {
  _mediaTarget = skill;
  _selectedMedia = null;
  document.getElementById('mediaModalTitle').textContent = 'Material para ' + skill.charAt(0).toUpperCase() + skill.slice(1);
  document.getElementById('mediaSearch').value = '';
  setMediaTab('movies');
  document.getElementById('mediaModal').classList.add('open');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

function setMediaTab(tab) {
  _mediaTab = tab;
  document.getElementById('mtab-movies').classList.toggle('active', tab==='movies');
  document.getElementById('mtab-songs').classList.toggle('active', tab==='songs');
  if (tab === 'movies' && _allMovies.length === 0) loadMovies();
  else if (tab === 'songs' && _allSongs.length === 0) loadSongs();
  else renderMediaList();
}

function loadMovies() {
  document.getElementById('mediaList').innerHTML = '<div style="text-align:center;padding:24px;color:var(--muted);font-size:12px;">Cargando películas…</div>';
  _sb.from('peliculas').select('id,titulo_main,titulo_sub,portada_url,studio,language')
    .eq('language', _lang).eq('activo', true).order('orden')
    .then(function(r) {
      _allMovies = r.data || [];
      renderMediaList();
    });
}

function loadSongs() {
  document.getElementById('mediaList').innerHTML = '<div style="text-align:center;padding:24px;color:var(--muted);font-size:12px;">Cargando canciones…</div>';
  _sb.from('canciones').select('id,titulo,artista,portada_url,language')
    .eq('language', _lang)
    .then(function(r) {
      _allSongs = r.data || [];
      renderMediaList();
    });
}

function renderMediaList() {
  var items = _mediaTab === 'movies' ? _allMovies : _allSongs;
  var q = document.getElementById('mediaSearch').value.toLowerCase();
  if (q) items = items.filter(function(x) {
    var t = (_mediaTab==='movies' ? x.titulo_main : x.titulo) || '';
    return t.toLowerCase().includes(q);
  });
  if (!items.length) {
    document.getElementById('mediaList').innerHTML = '<div style="text-align:center;padding:24px;color:var(--muted);font-size:12px;">Sin resultados</div>';
    return;
  }
  document.getElementById('mediaList').innerHTML = items.map(function(x) {
    var id = x.id;
    var title = _mediaTab==='movies' ? (x.titulo_main||'') : (x.titulo||'');
    var sub = _mediaTab==='movies' ? (x.studio||'') : (x.artista||'');
    var thumb = x.portada_url || '';
    var sel = _selectedMedia && _selectedMedia.id === id;
    return '<div class="media-item'+(sel?' selected':'')+'" onclick="selectMediaItem('+JSON.stringify({id:id,title:title,sub:sub,thumb:thumb,type:_mediaTab})+', this)">' +
      '<img class="mi-thumb" src="'+thumb+'" onerror="this.style.opacity=0" alt="">' +
      '<div class="mi-info">' +
        '<div class="mi-title">'+escHtml(title)+'</div>' +
        '<div class="mi-sub">'+escHtml(sub)+'</div>' +
      '</div>' +
      '<div class="mi-check">✓</div>' +
    '</div>';
  }).join('');
}

function selectMediaItem(data, el) {
  _selectedMedia = data;
  document.querySelectorAll('#mediaList .media-item').forEach(function(x){x.classList.remove('selected');});
  el.classList.add('selected');
}

function filterMedia() {
  renderMediaList();
}

function confirmMedia() {
  if (!_selectedMedia) { toast('⚠ Selecciona un elemento'); return; }
  var skill = _mediaTarget;
  showMediaPreview(skill, _selectedMedia.title, _selectedMedia.type==='movies'?'Película/Serie':'Canción', _selectedMedia.thumb);
  // inject into JSON
  injectMediaIntoJSON(skill, _selectedMedia);
  closeModal('mediaModal');
}

function showMediaPreview(skill, title, type, thumb) {
  var el = document.getElementById('mp-'+skill);
  if (!el) return;
  el.style.display = 'flex';
  document.getElementById('mp-title-'+skill).textContent = title;
  document.getElementById('mp-type-'+skill).textContent = type;
  var img = document.getElementById('mp-thumb-'+skill);
  if (img) { img.src = thumb; img.onerror = function(){this.style.opacity=0;}; }
}

function clearMedia(skill) {
  var el = document.getElementById('mp-'+skill);
  if (el) el.style.display = 'none';
  if (_mediaTarget === skill) _selectedMedia = null;
}

function injectMediaIntoJSON(skill, media) {
  var ta = document.getElementById('fta-'+skill);
  var current = tryParse(ta.value) || {};
  current.media_type = media.type === 'movies' ? 'movie' : 'song';
  current.media_title = media.title;
  current.media_thumb = media.thumb;
  if (media.type === 'movies') current.scene_id = media.id;
  else current.song_id = media.id;
  ta.value = JSON.stringify(current, null, 2);
}

function _getMediaForSkill(skill) {
  var ta = document.getElementById('fta-'+skill);
  var c = tryParse(ta.value);
  if (!c) return null;
  var out = {};
  if (c.scene_id) out.scene_id = c.scene_id;
  if (c.song_id) out.song_id = c.song_id;
  if (c.media_type) out.media_type = c.media_type;
  if (c.media_title) out.media_title = c.media_title;
  return Object.keys(out).length ? out : null;
}

// ─── PUBLISH VERSION ─────────────────────────────────────────
function publishVersion() {
  var vd = VERSIONS[_curV-1];
  var n = _dbData[vd.rank] ? Object.keys(_dbData[vd.rank]).length : 0;
  if (n < 7) {
    if (!confirm('Solo hay '+n+'/7 secciones guardadas. ¿Publicar de todas formas?')) return;
  }
  var score = parseInt(document.getElementById('score-input').value) || 70;
  // update score in DB via exam_meta or exam_content special row
  var row = {section:'_meta', rank:vd.rank, language:_lang, content:{min_score:score, published:true, published_at: new Date().toISOString()}, active:true};
  var existing = _dbData[vd.rank] && _dbData[vd.rank]['_meta'];
  var p = existing
    ? _sb.from('exam_content').update(row).eq('id', existing.id)
    : _sb.from('exam_content').insert([row]);
  p.then(function(r) {
    if (r.error) toast('❌ ' + r.error.message);
    else toast('🚀 Versión ' + vd.from + '→' + vd.to + ' publicada');
  });
}

// ─── PREVIEW ─────────────────────────────────────────────────
function openPreview() {
  var vd = VERSIONS[_curV-1];
  var src = 'examen-ascenso.html?v='+_curV+'&preview=1';
  document.getElementById('previewFrame').src = src;
  document.getElementById('previewModal').classList.add('open');
}

// ─── TOAST ───────────────────────────────────────────────────
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.classList.remove('show'); }, 2800);
}

// ─── CLOSE ON OVERLAY CLICK ──────────────────────────────────
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('modal-overlay')) {
    e.target.classList.remove('open');
  }
});

// ─── KEYBOARD SHORTCUT: Ctrl+S = save all open sections ──────
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey||e.metaKey) && e.key==='s') {
    e.preventDefault();
    document.querySelectorAll('.sec-card.open').forEach(function(card) {
      var key = card.id.replace('sc-','');
      saveSection(key);
    });
  }
});
</script>
</body>

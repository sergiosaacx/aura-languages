<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tema — Aura Languages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   AURA · TOPIC DETAIL
   Neon lime · dark surfaces · mono labels
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  /* surfaces */
  --bg:        #0a0a0a;
  --bg-2:      #0d0d0d;
  --card:      #141414;
  --card-2:    #181818;
  --card-3:    #1a1a1a;
  --line:      #232323;
  --line-2:    #2a2a2a;
  --line-3:    #333;

  /* ink */
  --ink:       #f5f5f5;
  --ink-2:     #c8c8c8;
  --ink-3:     #8a8a8a;
  --muted:     #6e6e6e;
  --muted-2:   #4a4a4a;

  /* accents */
  --accent:    #c4ff3d;
  --accent-d:  #a8e02f;
  --accent-rgb:196,255,61;
  --good:      #22c55e;
  --warn:      #fbbf24;
  --rose:      #fb7185;
  --violet:    #c084fc;
  --teal:      #5eead4;

  /* typography */
  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-body:    'Geist', system-ui, sans-serif;
  --font-mono:    'Geist Mono', ui-monospace, monospace;

  /* rank colors */
  --rk-bronce:    #cd7f32;
  --rk-plata:     #d1d5db;
  --rk-oro:       #fbbf24;
  --rk-platino:   #5eead4;
  --rk-diamante:  #60a5fa;
  --rk-challenger:#c084fc;
}

html,body{
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -.005em;
}

/* subtle backdrop */
body::before{
  content:"";
  position: fixed;
  inset: 0;
  background-image: radial-gradient(rgba(255,255,255,.022) 1px, transparent 1px);
  background-size: 24px 24px;
  pointer-events: none;
  z-index: 0;
}

/* ── PAGE WRAP ─────────────────────────────────────────────── */
.tp-page{
  position: relative;
  z-index: 1;
  padding-left: 76px; /* left sidebar clearance */
  min-height: 100vh;
}

/* ── TOP NAV BAR ───────────────────────────────────────────── */
.tp-topbar{
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 40px;
  background: linear-gradient(180deg, rgba(10,10,10,.85), rgba(10,10,10,0));
  backdrop-filter: blur(6px);
}
.tp-back{
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: rgba(20,20,20,.7);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 999px;
  padding: 9px 16px 9px 12px;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-2);
  cursor: pointer;
  text-decoration: none;
  transition: background .2s, border-color .2s, transform .12s;
}
.tp-back:hover{
  background: rgba(196,255,61,.08);
  border-color: rgba(196,255,61,.25);
  color: var(--accent);
  transform: translateX(-2px);
}
.tp-back svg{
  width: 14px; height: 14px;
  stroke: currentColor; fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.tp-crumb{
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: .14em;
  text-transform: uppercase;
}
.tp-crumb b{ color: var(--ink-2); font-weight: 700; }

/* ── HERO CARD ─────────────────────────────────────────────── */
.tp-hero{
  position: relative;
  margin: 4px 40px 36px;
  border-radius: 24px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.06);
  min-height: 380px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  isolation: isolate;
}
.tp-hero-bg{
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}
.tp-hero-bg-fallback{
  position: absolute;
  inset: 0;
  background: linear-gradient(155deg, #1a1a1a 0%, #2a2a2a 55%, #0d0d0d 100%);
  z-index: 0;
}
.tp-hero-bg img{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
  opacity: 0;
  animation: heroFadeIn .8s ease forwards;
  transform: scale(1.04);
}
@keyframes heroFadeIn{
  to { opacity: 1; transform: scale(1); }
}
.tp-hero-bg::after{
  content:"";
  position: absolute;
  inset: 0;
  z-index: 2;
  background:
    linear-gradient(to top, rgba(10,10,10,.96) 0%, rgba(10,10,10,.65) 45%, rgba(10,10,10,.25) 70%, transparent 100%),
    linear-gradient(to right, rgba(10,10,10,.4) 0%, transparent 40%);
}

.tp-hero-content{
  position: relative;
  z-index: 3;
  padding: 48px 44px 36px;
}

.tp-hero-pills{
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}
.tp-pill{
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 6px 12px 6px 9px;
  border-radius: 999px;
  background: rgba(20,20,20,.6);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.1);
  color: var(--ink-2);
}
.tp-pill svg{
  width: 12px; height: 12px;
  stroke: currentColor; fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.tp-pill.tp-pill-rank{
  background: rgba(20,20,20,.6);
  border-color: rgba(255,255,255,.12);
}
.tp-pill.tp-pill-rank .tp-pill-dot{
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--rank-color, #cd7f32);
  box-shadow: 0 0 8px var(--rank-color, #cd7f32);
}
.tp-pill.tp-pill-cefr{
  background: var(--rank-color);
  color: #0a0a0a;
  border-color: transparent;
}
.tp-pill.tp-pill-type{
  font-family: var(--font-body);
  font-size: 12px;
  letter-spacing: -.005em;
  text-transform: none;
  font-weight: 600;
  color: var(--ink);
}
.tp-pill-glyph{
  font-family: var(--font-display);
  font-size: 13px;
  color: rgba(255,255,255,.7);
}

.tp-title{
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(2.6rem, 4.6vw, 3.8rem);
  line-height: .95;
  letter-spacing: -.035em;
  color: #fff;
  text-transform: uppercase;
  margin-bottom: 12px;
  text-shadow: 0 4px 24px rgba(0,0,0,.5);
}
.tp-sub{
  font-family: var(--font-mono);
  font-size: 13.5px;
  font-weight: 600;
  color: rgba(255,255,255,.7);
  letter-spacing: .06em;
  text-transform: uppercase;
  margin-bottom: 28px;
}

/* hero stats row */
.tp-stats{
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}
.tp-stat{
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 18px 11px 13px;
  background: rgba(20,20,20,.55);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 14px;
}
.tp-stat-ico{
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.08);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-2);
  flex-shrink: 0;
}
.tp-stat.s-accent .tp-stat-ico{
  background: rgba(196,255,61,.12);
  border-color: rgba(196,255,61,.3);
  color: var(--accent);
}
.tp-stat.s-warn .tp-stat-ico{
  background: rgba(251,191,36,.12);
  border-color: rgba(251,191,36,.3);
  color: var(--warn);
}
.tp-stat-ico svg{
  width: 14px; height: 14px;
  stroke: currentColor; fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.tp-stat-text{ line-height: 1.1; }
.tp-stat-val{
  font-family: var(--font-display);
  font-size: 1.05rem;
  font-weight: 700;
  color: #fff;
  letter-spacing: -.01em;
}
.tp-stat-lbl{
  margin-top: 3px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 600;
  color: rgba(255,255,255,.55);
  letter-spacing: .14em;
  text-transform: uppercase;
}

/* hero progress bar */
.tp-progress{
  max-width: 480px;
}
.tp-progress-bar{
  height: 6px;
  background: rgba(0,0,0,.45);
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 999px;
  overflow: hidden;
  position: relative;
}
.tp-progress-fill{
  height: 100%;
  background: linear-gradient(90deg, var(--accent-d), var(--accent));
  border-radius: 999px;
  box-shadow: 0 0 12px rgba(196,255,61,.5);
  position: relative;
  transition: width .6s cubic-bezier(.2,.8,.2,1);
}
.tp-progress-fill::after{
  content:"";
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 30%, rgba(255,255,255,.45) 50%, transparent 70%);
  animation: shimmer 2.4s ease-in-out infinite;
}
@keyframes shimmer{
  0%{ transform: translateX(-100%); }
  100%{ transform: translateX(100%); }
}

/* ── BODY ──────────────────────────────────────────────────── */
.tp-body{
  padding: 0 40px 100px;
  max-width: 920px;
}

/* section header */
.tp-section-head{
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
  position: relative;
}
.tp-section-head::after{
  content:"";
  position: absolute;
  left: 0; bottom: -1px;
  width: 60px;
  height: 1px;
  background: linear-gradient(90deg, var(--accent), transparent);
  box-shadow: 0 0 8px rgba(196,255,61,.6);
}
.tp-section-label{
  font-family: var(--font-display);
  font-size: 1.45rem;
  font-weight: 800;
  letter-spacing: -.025em;
  color: var(--ink);
  display: flex;
  align-items: baseline;
  gap: 12px;
}
.tp-section-label small{
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: .14em;
  text-transform: uppercase;
}
.tp-section-meta{
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: .12em;
  text-transform: uppercase;
}

.tp-section + .tp-section{ margin-top: 36px; }

/* ── EXERCISE LIST ─────────────────────────────────────────── */
.ex-list{
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* single exercise item */
.ex-item{
  display: grid;
  grid-template-columns: 38px 52px 1fr auto auto;
  align-items: center;
  gap: 16px;
  padding: 14px 18px 14px 14px;
  border-radius: 16px;
  background: linear-gradient(180deg, var(--card-2), var(--card));
  border: 1px solid var(--line);
  cursor: pointer;
  text-decoration: none;
  transition: background .18s, border-color .2s, transform .15s, box-shadow .2s;
  position: relative;
  overflow: hidden;
}
.ex-item::before{
  content:"";
  position: absolute;
  left: 0; top: 12px; bottom: 12px;
  width: 2px;
  border-radius: 0 2px 2px 0;
  background: transparent;
  transition: background .2s;
}
.ex-item:hover{
  background: linear-gradient(180deg, var(--card-3), var(--card-2));
  border-color: var(--line-2);
  transform: translateX(2px);
}
.ex-item:hover::before{
  background: rgba(196,255,61,.4);
}

/* number column */
.ex-num{
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: .04em;
  text-align: center;
}
.ex-item[data-status="next"] .ex-num{
  color: var(--accent);
  text-shadow: 0 0 10px rgba(196,255,61,.5);
}
.ex-item[data-status="done"] .ex-num{ color: var(--good); }

/* icon column */
.ex-icon{
  width: 48px;
  height: 48px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--line-2);
  color: var(--ink-2);
  transition: transform .2s;
}
.ex-icon svg{
  width: 19px; height: 19px;
  stroke: currentColor; fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.ex-item:hover .ex-icon{ transform: scale(1.05) rotate(-2deg); }

/* text column */
.ex-text{ min-width: 0; }
.ex-name{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: -.015em;
  color: var(--ink);
  margin-bottom: 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ex-meta{
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.ex-chip{
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--line-2);
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  color: var(--ink-3);
  letter-spacing: .08em;
  text-transform: uppercase;
}
.ex-chip-dot{
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--chip-color, var(--muted));
}
.ex-time{
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: .04em;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.ex-time svg{
  width: 11px; height: 11px;
  stroke: currentColor; fill: none;
  stroke-width: 2;
}
.ex-xp{
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: .04em;
}

/* status column */
.ex-status{
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 5px 11px;
  border-radius: 999px;
  white-space: nowrap;
}
.ex-status.st-next{
  background: linear-gradient(180deg, #c4ff3d, #a8e02f);
  color: #0a0a0a;
  box-shadow: 0 2px 10px rgba(196,255,61,.4);
}
.ex-status.st-done{
  background: rgba(34,197,94,.12);
  border: 1px solid rgba(34,197,94,.3);
  color: var(--good);
}
.ex-status.st-locked{
  background: rgba(255,255,255,.04);
  color: var(--muted);
  border: 1px solid var(--line);
}

/* arrow column */
.ex-arrow{
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--line-2);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-3);
  transition: all .2s;
}
.ex-arrow svg{
  width: 13px; height: 13px;
  stroke: currentColor; fill: none;
  stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
}
.ex-item:hover .ex-arrow{
  background: rgba(196,255,61,.12);
  border-color: rgba(196,255,61,.3);
  color: var(--accent);
  transform: translateX(2px);
}

/* ── TOOL ITEMS (Herramientas Aura) ────────────────────────── */
.ex-item.tool-item{
  background:
    linear-gradient(180deg, rgba(196,255,61,.06), rgba(196,255,61,.02)),
    linear-gradient(180deg, var(--card-2), var(--card));
  border-color: rgba(196,255,61,.18);
}
.ex-item.tool-item::before{
  background: linear-gradient(180deg, var(--accent), var(--accent-d));
  box-shadow: 0 0 12px rgba(196,255,61,.6);
}
.ex-item.tool-item:hover{
  background:
    linear-gradient(180deg, rgba(196,255,61,.1), rgba(196,255,61,.04)),
    linear-gradient(180deg, var(--card-3), var(--card-2));
  border-color: rgba(196,255,61,.32);
  box-shadow: 0 8px 24px rgba(196,255,61,.08);
}
.ex-item.tool-item .ex-icon{
  background: rgba(196,255,61,.1);
  border-color: rgba(196,255,61,.3);
  color: var(--accent);
}
.ex-item.tool-item .ex-name{ color: #fff; }
.ex-item.tool-item .ex-arrow{
  background: rgba(196,255,61,.12);
  border-color: rgba(196,255,61,.3);
  color: var(--accent);
}

/* ── NOT AVAILABLE STATE ───────────────────────────────────── */
.tp-unavailable{
  margin: 0 40px;
  padding: 64px 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  text-align: center;
  background: linear-gradient(180deg, var(--card-2), var(--card));
  border: 1px dashed var(--line-2);
  border-radius: 18px;
}
.tp-unavailable-ico{
  width: 64px; height: 64px;
  border-radius: 18px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--line-2);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
}
.tp-unavailable-ico svg{ width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 1.5; }
.tp-unavailable h2{
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.6rem;
  letter-spacing: -.02em;
  color: var(--ink);
}
.tp-unavailable p{
  color: var(--ink-3);
  font-size: 14px;
  max-width: 360px;
  line-height: 1.6;
}
.tp-unavailable a{
  margin-top: 8px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--accent);
  color: #0a0a0a;
  font-family: var(--font-body);
  font-weight: 700;
  padding: 10px 20px;
  border-radius: 999px;
  text-decoration: none;
  transition: transform .12s, box-shadow .2s;
  box-shadow: 0 4px 0 #6a8a1f, 0 8px 22px rgba(196,255,61,.35);
}
.tp-unavailable a:hover{ transform: translateY(-1px); }
.tp-unavailable a:active{ transform: translateY(2px); box-shadow: 0 2px 0 #6a8a1f, 0 4px 12px rgba(196,255,61,.4); }

/* ── RESPONSIVE ────────────────────────────────────────────── */
@media(max-width:900px){
  .ex-item{
    grid-template-columns: 32px 48px 1fr auto;
  }
  .ex-status{ display: none; }
}
@media(max-width:768px){
  .tp-page{ padding-left: 0; }
  .tp-topbar{ padding: 14px 16px; }
  .tp-hero{ margin: 4px 16px 28px; border-radius: 18px; }
  .tp-hero-content{ padding: 32px 22px 24px; }
  .tp-body{ padding: 0 16px 80px; }
  .tp-title{ font-size: 2.2rem; }
  .tp-section-label{ font-size: 1.2rem; }
  .ex-item{
    grid-template-columns: 28px 44px 1fr auto;
    gap: 10px;
    padding: 12px 12px 12px 10px;
  }
  .ex-icon{ width: 44px; height: 44px; }
}
</style>
</head>
<body>

<div class="tp-page">

  <!-- Top nav -->
  <div class="tp-topbar">
    <a class="tp-back" href="progreso.html">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
      <span>Volver al camino</span>
    </a>
    <div class="tp-crumb" id="tpCrumb">— · —</div>
  </div>

  <!-- HERO (populated by JS) -->
  <div class="tp-hero" id="tpHero">
    <div class="tp-hero-bg" id="tpHeroBg">
      <div class="tp-hero-bg-fallback"></div>
    </div>
    <div class="tp-hero-content" id="tpHeroContent">
      <!-- JS renders here -->
    </div>
  </div>

  <!-- BODY (populated by JS) -->
  <div class="tp-body" id="tpBody">
    <!-- JS renders here -->
  </div>

</div>

<!-- ═══ SCRIPTS ══════════════════════════════════════════════ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="aura-supabase.js"></script>

    3:{

        {name:'Article Match',         type:'Emparejar',            time:4, xp:30, chip:'#8b5cf6'},
        {name:'Complete the Story',    type:'Completar espacios',   time:5, xp:35, chip:'#10b981'},
        {name:'Build the Phrase',      type:'Ordenar palabras',     time:4, xp:30, chip:'#f59e0b'},
        {name:'Articles in Real Songs',type:'Herramienta Aura',     time:6, xp:50, tool:true, href:'lyriclab.html'},
      ]
    },
    4:{
      rank:'Bronce', cefr:'A1',
      title:'NAME\nEVERYTHING',
      sub:'Basic Nouns',
      img: imgUrl('labeled everyday objects, still life arrangement'),
      exercises:[
        {name:'What is it?',                type:'Selección múltiple',  time:3, xp:25, chip:'#3b82f6'},
        {name:'Word Match',                 type:'Emparejar',           time:4, xp:30, chip:'#8b5cf6'},
        {name:'Fill with the Right Noun',   type:'Completar espacios',  time:5, xp:35, chip:'#10b981'},
        {name:'Build the Phrase',           type:'Ordenar palabras',    time:4, xp:30, chip:'#f59e0b'},
        {name:'Find the Nouns in Songs',    type:'Herramienta Aura',    time:6, xp:50, tool:true, href:'lyriclab.html'},
      ]
    },
    5:{
      rank:'Bronce', cefr:'A1',
      title:'COUNT THE\nWORLD',
      sub:'Numbers & Counting',
      img: imgUrl('floating numbers and digits, geometric'),
      exercises:[
        {name:'Say the Number',         type:'Selección múltiple',  time:3, xp:25, chip:'#3b82f6'},
        {name:'Number Match',           type:'Emparejar',           time:4, xp:30, chip:'#8b5cf6'},
        {name:'Write it Out',           type:'Completar espacios',  time:5, xp:35, chip:'#10b981'},
        {name:'Numbers in Real Context',type:'Herramienta Aura',    time:6, xp:50, tool:true, href:'movies.html'},
      ]
    },
    6:{
      rank:'Bronce', cefr:'A1',
      title:'COLOR YOUR\nWORDS',
      sub:'Basic Adjectives',
      img: imgUrl('colorful paint splash on dark background'),
      exercises:[
        {name:'Pick the Adjective', type:'Selección múltiple',  time:3, xp:25, chip:'#3b82f6'},
        {name:'Describe It',        type:'Emparejar',           time:4, xp:30, chip:'#8b5cf6'},
        {name:'Add the Adjective',  type:'Completar espacios',  time:5, xp:35, chip:'#10b981'},
        {name:'Adjective Order',    type:'Ordenar palabras',    time:4, xp:30, chip:'#f59e0b'},
        {name:'Feel the Adjectives',type:'Herramienta Aura',    time:6, xp:50, tool:true, href:'lyriclab.html'},
      ]
    },
    7:{
      rank:'Bronce', cefr:'A1',
      title:'DAILY\nHABITS',
      sub:'Present Simple',
      img: imgUrl('morning routine, coffee cup and open book'),
      exercises:[
        {name:'True or False?',       type:'Selección múltiple',  time:3, xp:25, chip:'#3b82f6'},
        {name:'Complete the Routine', type:'Completar espacios',  time:5, xp:35, chip:'#10b981'},
        {name:'Build the Habit',      type:'Ordenar palabras',    time:4, xp:30, chip:'#f59e0b'},
        {name:'Fix the Verb',         type:'Corrección de errores',time:5, xp:35, chip:'#ef4444'},
        {name:'Daily Life in Songs',  type:'Herramienta Aura',    time:6, xp:50, tool:true, href:'lyriclab.html'},
        {name:'Routines in Movies',   type:'Herramienta Aura',    time:7, xp:55, tool:true, href:'movies.html'},
      ]
    },
    8:{
      rank:'Bronce', cefr:'A1',
      title:'HERE\n& THERE',
      sub:'Prepositions of Place & Time',
      img: imgUrl('compass and map, navigation, location'),
      exercises:[
        {name:'Where is it?',           type:'Selección múltiple',  time:3, xp:25, chip:'#3b82f6'},
        {name:'Match the Place',        type:'Emparejar',           time:4, xp:30, chip:'#8b5cf6'},
        {name:'Complete the Direction', type:'Completar espacios',  time:5, xp:35, chip:'#10b981'},
        {name:'Place the Preposition',  type:'Ordenar palabras',    time:4, xp:30, chip:'#f59e0b'},
        {name:'Find Your Way in Movies',type:'Herramienta Aura',    time:6, xp:50, tool:true, href:'movies.html'},
      ]
    },
    9:{
      rank:'Bronce', cefr:'A1',
      title:'ASK\nAWAY',
      sub:'Basic Questions',
      img: imgUrl('neon question mark glowing in the dark'),
      exercises:[
        {name:'Which Question Word?', type:'Selección múltiple',  time:3, xp:25, chip:'#3b82f6'},
        {name:'Complete the Question',type:'Completar espacios',  time:5, xp:35, chip:'#10b981'},
        {name:'Build the Question',   type:'Ordenar palabras',    time:4, xp:30, chip:'#f59e0b'},
        {name:'Fix the Question',     type:'Corrección de errores',time:5, xp:35, chip:'#ef4444'},
        {name:'Questions in Songs',   type:'Herramienta Aura',    time:6, xp:50, tool:true, href:'lyriclab.html'},
      ]
    },
    10:{
      rank:'Bronce', cefr:'A1',
      title:'NOT\nTODAY',
      sub:'Negation',
      img: imgUrl('forbidden sign, crossed out, no entry'),
      exercises:[
        {name:'Positive or Negative?',type:'Selección múltiple',  time:3, xp:25, chip:'#3b82f6'},
        {name:'Make it Negative',     type:'Completar espacios',  time:5, xp:35, chip:'#10b981'},
        {name:'Negate the Sentence',  type:'Ordenar palabras',    time:4, xp:30, chip:'#f59e0b'},
        {name:'Fix the Negation',     type:'Corrección de errores',time:5, xp:35, chip:'#ef4444'},
        {name:'Negation in Action',   type:'Herramienta Aura',    time:6, xp:50, tool:true, href:'movies.html'},
      ]
    },
  };

  /* ── READ URL PARAM ──────────────────────────────────────────────── */
  const params  = new URLSearchParams(window.location.search);
  const topicId = parseInt(params.get('id')) || 1;
  const topic   = TOPICS[topicId];

  document.title = (topic ? topic.sub : 'Tema') + ' — Aura Languages';

  const heroBg      = document.getElementById('tpHeroBg');
  const heroContent = document.getElementById('tpHeroContent');
  const body        = document.getElementById('tpBody');
  const crumb       = document.getElementById('tpCrumb');

  /* ── NOT-AVAILABLE STATE ─────────────────────────────────────────── */
  if(!topic){
    document.getElementById('tpHero').remove();
    crumb.innerHTML = `Tema · <b>No disponible</b>`;
    body.innerHTML = `
      <div class="tp-unavailable">
        <div class="tp-unavailable-ico">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>
        <h2>Ejercicios no disponibles aún</h2>
        <p>Este tema se activará próximamente. Mientras tanto, sigue practicando con las herramientas de Aura.</p>
        <a href="progreso.html">← Volver al camino</a>
      </div>`;
    return;
  }

  /* ── PREP DATA ───────────────────────────────────────────────────── */
  const rankMeta = RANK_META[topic.rank] || {color:'#cd7f32'};
  document.documentElement.style.setProperty('--rank-color', rankMeta.color);

  const exerciseCount = topic.exercises.filter(e => !e.tool).length;
  const totalCount    = topic.exercises.length;
  const totalTime     = topic.exercises.reduce((s,e) => s + e.time, 0);
  const totalXp       = topic.exercises.reduce((s,e) => s + e.xp, 0);

  /* mocked progress: 0 done, first one is "next" */
  const doneCount = 0;
  const progress  = Math.round((doneCount / totalCount) * 100);

  /* breadcrumb */
  crumb.innerHTML = `${topic.rank} · ${topic.cefr} · <b>${topic.sub}</b>`;

  /* ── HERO ────────────────────────────────────────────────────────── */
  /* image */
  if(topic.img){
    const img = document.createElement('img');
    img.src = topic.img;
    img.alt = '';
    img.loading = 'eager';
    img.decoding = 'async';
    img.onerror = () => img.remove();
    heroBg.appendChild(img);
  }

  /* content */
  const titleLines = topic.title.split('\n');
  const typeName = topic.exercises[0] && !topic.exercises[0].tool
    ? 'Grammar' /* placeholder; could be derived */
    : 'Practice';

  heroContent.innerHTML = `
    <div class="tp-hero-pills">
      <span class="tp-pill tp-pill-rank">
        <span class="tp-pill-dot"></span>
        ${topic.rank}
      </span>
      <span class="tp-pill tp-pill-cefr" style="background:${rankMeta.color}">${topic.cefr}</span>
      <span class="tp-pill tp-pill-type">
        <span class="tp-pill-glyph">◎</span>
        Grammar
      </span>
    </div>

    <h1 class="tp-title">${titleLines.join('<br>')}</h1>
    <p class="tp-sub">${topic.sub}</p>

    <div class="tp-stats">
      <div class="tp-stat s-accent">
        <div class="tp-stat-ico">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div class="tp-stat-text">
          <div class="tp-stat-val">${doneCount} / ${totalCount}</div>
          <div class="tp-stat-lbl">Completados</div>
        </div>
      </div>
      <div class="tp-stat">
        <div class="tp-stat-ico">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </div>
        <div class="tp-stat-text">
          <div class="tp-stat-val">~${totalTime} min</div>
          <div class="tp-stat-lbl">Duración</div>
        </div>
      </div>
      <div class="tp-stat s-warn">
        <div class="tp-stat-ico">
          <svg viewBox="0 0 24 24"><polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polyline></svg>
        </div>
        <div class="tp-stat-text">
          <div class="tp-stat-val">+${totalXp} XP</div>
          <div class="tp-stat-lbl">Recompensa</div>
        </div>
      </div>
    </div>

    <div class="tp-progress">
      <div class="tp-progress-bar">
        <div class="tp-progress-fill" id="progFill" style="width:0%"></div>
      </div>
    </div>
  `;

  /* animate progress bar in */
  setTimeout(() => {
    const fill = document.getElementById('progFill');
    if(fill) fill.style.width = progress + '%';
  }, 200);

  /* ── BODY: EXERCISES + TOOLS sections ────────────────────────────── */
  const exercises = topic.exercises.filter(e => !e.tool);
  const tools     = topic.exercises.filter(e => e.tool);

  let html = '';

  /* Exercises section */
  if(exercises.length){
    const exTime = exercises.reduce((s,e) => s + e.time, 0);
    html += `
      <div class="tp-section">
        <div class="tp-section-head">
          <div class="tp-section-label">
            Ejercicios
            <small>${exercises.length} actividades</small>
          </div>
          <div class="tp-section-meta">~${exTime} min · +${exercises.reduce((s,e) => s + e.xp, 0)} XP</div>
        </div>
        <div class="ex-list" id="exList"></div>
      </div>
    `;
  }

  /* Tools section */
  if(tools.length){
    const toTime = tools.reduce((s,e) => s + e.time, 0);
    html += `
      <div class="tp-section">
        <div class="tp-section-head">
          <div class="tp-section-label">
            Herramientas Aura
            <small>Práctica con contenido real</small>
          </div>
          <div class="tp-section-meta">~${toTime} min · +${tools.reduce((s,e) => s + e.xp, 0)} XP</div>
        </div>
        <div class="ex-list" id="toolList"></div>
      </div>
    `;
  }

  body.innerHTML = html;

  /* render exercise items */
  function renderItem(ex, idx, isTool){
    const item = document.createElement(ex.href ? 'a' : 'div');
    item.className = 'ex-item' + (isTool ? ' tool-item' : '');
    if(ex.href) item.href = ex.href;

    /* status (mocked: first non-tool exercise is "next", rest are blank) */
    let status = '';
    if(!isTool && idx === 0 && doneCount === 0){
      status = `<span class="ex-status st-next">Siguiente</span>`;
      item.dataset.status = 'next';
    }

    const icon = TYPE_ICONS[ex.type] || TYPE_ICONS['Selección múltiple'];
    const num  = isTool ? '★' : String(idx+1).padStart(2,'0');

    item.innerHTML = `
      <div class="ex-num">${num}</div>
      <div class="ex-icon">${icon}</div>
      <div class="ex-text">
        <div class="ex-name">${ex.name}</div>
        <div class="ex-meta">
          <span class="ex-chip">
            <span class="ex-chip-dot" style="background:${ex.chip || 'currentColor'}"></span>
            ${ex.type}
          </span>
          <span class="ex-time">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            ${ex.time} min
          </span>
          <span class="ex-xp">+${ex.xp} XP</span>
        </div>
      </div>
      ${status}
      <div class="ex-arrow">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </div>
    `;
    return item;
  }

  const exList   = document.getElementById('exList');
  const toolList = document.getElementById('toolList');
  exercises.forEach((ex, i) => exList && exList.appendChild(renderItem(ex, i, false)));
  tools.forEach((ex, i)     => toolList && toolList.appendChild(renderItem(ex, i, true)));

  /* ── AUTH (non-blocking) ─────────────────────────────────────────── */
  try {
    if(window._aura?.sb){
      const { data:{ session } } = await window._aura.sb.auth.getSession();
      if(session){
        await window._aura.loadProfile(session.user.id);
        /* TODO: load user's exercise progress for this topic from DB */
      }
    }
  } catch(e){ /* silent */ }

})();
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Ruta — Aura Languages</title>
<link rel="stylesheet" href="topic.css?v=6">
</head>
<body>

<!-- ── Contenedor principal ─────────────────────────────────── -->
<div class="tp-wrap" id="tpWrap">

  <!-- VISTA LISTA -->
  <div class="tp-list-view" id="viewList">
    <!-- Renderizado por topic-list.js → renderList() -->
  </div>

  <!-- VISTA JUEGO (overlay full-screen) -->
  <div class="view-game" id="viewGame" style="display:none">

    <!-- HUD -->
    <div class="hud">
      <button class="hud-close" id="hudClose" title="Salir">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="hud-prog" id="hudProg"></div>
      <div class="hud-xp">
        <div class="ic"><svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
        <span id="hudXpVal">0 XP</span>
      </div>
      <div class="hud-lives" id="hudLives"></div>
    </div>

    <!-- Stage -->
    <div class="stage" id="gameStage"></div>

    <!-- Footer feedback -->
    <div class="gm-footer" id="gameFooter" style="display:none">
      <div class="gm-footer-inner">
        <div class="gm-feedback" id="gameFeedback" style="display:none">
          <div class="gm-fb-ico" id="gameFbIco"></div>
          <div class="gm-fb-txt">
            <div class="gm-fb-title" id="gameFbTitle"></div>
            <div class="gm-fb-detail" id="gameFbDetail"></div>
          </div>
        </div>
        <button class="gm-btn gm-btn-accent" id="gameActionBtn" disabled>
          Comprobar <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </button>
      </div>
    </div>

  </div><!-- /view-game -->

</div><!-- /tp-wrap -->

<!-- ── Scripts (orden obligatorio) ─────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="aura-supabase.js"></script>
<script src="aura-shell.js?v=1"></script>

<!-- Globals compartidos (deben estar antes que los módulos) -->
<script>
(function(){
'use strict';

window.I   = function(id){ return document.getElementById(id); };
window.IS  = function(s){ return document.querySelector(s); };
window.ISA = function(s){ return document.querySelectorAll(s); };

window.shuffle = function(a){
  var b=[].concat(a);
  for(var i=b.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=b[i];b[i]=b[j];b[j]=tmp;
  }
  return b;
};

window.IMG = function(p){
  return 'https://image.pollinations.ai/prompt/'+
    encodeURIComponent(p+', minimalist abstract concept art, dark moody cinematic, deep shadows')+
    '?width=1280&height=720&nologo=true&model=flux&seed=42';
};

window.RM={
  Bronce:'#cd7f32',Plata:'#d1d5db',Oro:'#fbbf24',
  Platino:'#5eead4',Diamante:'#60a5fa',Challenger:'#c084fc'
};

window.STATE={view:'list',topic:null,step:0,score:0,lives:5,correct:0,checked:false};

window._gameSeq=[];
window._mcSel=null;
window._mSel=null;
window._mDone=0;
window._efDone={};
window._mcCorrect=0;
window._orderSents=[];
window._fixSents=[];
window._scrWords=[];
window._trItems=[];
window._trSel={};
window._trPage=0;
window._tfSel={};
window._tfStmts=[];
window._TR_PAGE=3;

})();
</script>

<!-- Módulos -->
<script src="topic-data.js"></script>
<!-- Juegos por tarjeta — agregar un archivo por cada tarjeta nueva -->
<script src="topic-list.js"></script>
<script src="topic-game.js"></script>

<!-- Inicialización -->
<script>
(function(){
'use strict';

function boot(){
  renderList();
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

window.addEventListener('aura:session', function(){
  if(STATE.view==='list') renderList();
}, {once:true});

try{
  if(window._aura&&window._aura.sb){
    window._aura.sb.auth.getSession().then(function(res){
      var session=res&&res.data&&res.data.session;
      if(session&&window._aura.loadProfile){
        window._aura.loadProfile(session.user.id);
      }
    });
  }
}catch(e){}

})();
</script>

</body>
</html>

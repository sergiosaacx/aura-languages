<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tema — Aura Languages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   AURA · TOPIC DETAIL
   Neon lime · dark surfaces · mono labels
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  /* surfaces */
  --bg:        #0a0a0a;
  --bg-2:      #0d0d0d;
  --card:      #141414;
  --card-2:    #181818;
  --card-3:    #1a1a1a;
  --line:      #232323;
  --line-2:    #2a2a2a;
  --line-3:    #333;

  /* ink */
  --ink:       #f5f5f5;
  --ink-2:     #c8c8c8;
  --ink-3:     #8a8a8a;
  --muted:     #6e6e6e;
  --muted-2:   #4a4a4a;

  /* accents */
  --accent:    #c4ff3d;
  --accent-d:  #a8e02f;
  --accent-rgb:196,255,61;
  --good:      #22c55e;
  --warn:      #fbbf24;
  --rose:      #fb7185;
  --violet:    #c084fc;
  --teal:      #5eead4;

  /* typography */
  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-body:    'Geist', system-ui, sans-serif;
  --font-mono:    'Geist Mono', ui-monospace, monospace;

  /* rank colors */
  --rk-bronce:    #cd7f32;
  --rk-plata:     #d1d5db;
  --rk-oro:       #fbbf24;
  --rk-platino:   #5eead4;
  --rk-diamante:  #60a5fa;
  --rk-challenger:#c084fc;
}

html,body{
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -.005em;
}

/* subtle backdrop */
body::before{
  content:"";
  position: fixed;
  inset: 0;
  background-image: radial-gradient(rgba(255,255,255,.022) 1px, transparent 1px);
  background-size: 24px 24px;
  pointer-events: none;
  z-index: 0;
}

/* ── PAGE WRAP ─────────────────────────────────────────────── */
/* ── PAGE LAYOUT: side-by-side, no scroll ───────────────── */
:root{--side-w:280px;}
.tp-page{
  position:fixed;
  top:0;left:76px;right:0;bottom:0;
  display:flex;
  overflow:hidden;
  background:var(--bg);
  z-index:1;
}

/* ── LEFT PANEL ─────────────────────────────────────────── */
.tp-side{
  width:var(--side-w);
  flex-shrink:0;
  background:#0f0d24;
  border-right:1px solid rgba(255,255,255,.08);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.tp-side-img{
  width:100%;height:160px;
  position:relative;
  overflow:hidden;
  background:#1a103f;
  flex-shrink:0;
}
.tp-side-img img{
  width:100%;height:100%;
  object-fit:cover;
  opacity:.55;
}
.tp-side-img-fade{
  position:absolute;bottom:0;left:0;right:0;height:80px;
  background:linear-gradient(to top,#0f0d24,transparent);
}
.tp-side-info{
  padding:16px 18px;
  flex:1;
  display:flex;
  flex-direction:column;
  gap:12px;
  overflow:hidden;
}
.tp-side-pills{display:flex;gap:6px;flex-wrap:wrap;}
.tp-side-title{
  font-size:19px;font-weight:900;color:#fff;
  line-height:1.1;letter-spacing:-.3px;
}
.tp-side-sub{
  font-size:10px;color:rgba(255,255,255,.38);
  letter-spacing:1.5px;text-transform:uppercase;
  margin-top:2px;
}
.tp-side-subtitle{
  font-size:11px;color:rgba(255,255,255,.45);
  letter-spacing:.4px;margin-top:-6px;
}
.tp-side-meta{
  font-size:11px;color:rgba(255,255,255,.3);
  margin-top:auto;
}
.tp-side-xp{
  display:flex;align-items:center;gap:6px;
  font-size:13px;font-weight:700;color:#a3e635;
  margin-top:4px;
}
.tp-side-xp svg{width:14px;height:14px;stroke:#a3e635;fill:none;stroke-width:2;flex-shrink:0;}
.tp-side-chips{display:flex;gap:8px;}
.tp-side-chip{
  flex:1;display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.05);border:0.5px solid rgba(255,255,255,.1);
  border-radius:10px;padding:8px 10px;
}
.tp-side-chip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0;}
.tp-side-chip .sc-val{font-size:14px;font-weight:700;color:#fff;}
.tp-side-chip .sc-lbl{font-size:9px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.7px;}
.tp-side-chip.accent svg{color:#a3e635;}
.tp-side-chip.purple svg{color:#a78bfa;}

.tp-side-prog{margin-top:auto;}
.tp-side-prog-lbl{font-size:10px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;}
.tp-side-prog-name{font-size:11px;color:rgba(255,255,255,.4);margin-top:5px;}
.tp-side-dots{display:flex;gap:5px;flex-wrap:wrap;}
.tp-side-dot{height:4px;flex:1;min-width:14px;border-radius:2px;background:rgba(255,255,255,.12);}
.tp-side-dot.done{background:#7c3aed;}
.tp-side-dot.active{background:#a3e635;}

.tp-side-foot{
  padding:14px 18px;
  border-top:0.5px solid rgba(255,255,255,.06);
  flex-shrink:0;
}
.tp-back{
  display:flex;align-items:center;gap:7px;
  color:rgba(255,255,255,.35);font-size:12px;
  text-decoration:none;
  transition:color .15s;
}
.tp-back:hover{color:rgba(255,255,255,.7);}
.tp-back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}

/* ── RIGHT PANEL ────────────────────────────────────────── */
.tp-main{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding:28px 32px;
  gap:16px;
}
.gm-card-wrap{
  flex:1;overflow-y:auto;padding:0 32px 32px;
  display:flex;flex-direction:column;
}
.tp-main.list-view{
  overflow-y:auto;
}

/* ── PILL badges (kept for list view cards) ─────────────── */
.tp-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.4px;}
.tp-pill-rank{background:rgba(205,127,50,.15);color:#e8a85a;}
.tp-pill-cefr{color:#fff;font-size:10px;padding:4px 8px;border-radius:12px;}
.tp-pill-type{background:rgba(255,255,255,.07);color:rgba(255,255,255,.5);}
.tp-pill-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8;}
.tp-pill-glyph{font-size:11px;}

/* ── TOPIC LIST (right panel in list view) ──────────────── */
.ex-list{display:flex;flex-direction:column;gap:10px;}
.ex-item{
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;border-radius:16px;
  background:rgba(255,255,255,.03);
  border:0.5px solid rgba(255,255,255,.07);
  transition:background .18s,border-color .18s;
}
.ex-item:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);}
.ex-num{font-size:12px;font-weight:700;color:rgba(255,255,255,.2);min-width:24px;text-align:right;}
.ex-icon{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.06);border-radius:10px;}
.ex-icon svg{width:18px;height:18px;stroke:rgba(255,255,255,.5);fill:none;stroke-width:2;}
.ex-text{flex:1;min-width:0;}
.ex-name{font-size:14px;font-weight:700;color:rgba(255,255,255,.9);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ex-meta{display:flex;gap:10px;align-items:center;}
.ex-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:rgba(255,255,255,.4);}
.ex-chip-dot{width:6px;height:6px;border-radius:50%;}
.ex-time{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:rgba(255,255,255,.4);}
.ex-time svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;}
.ex-xp{font-size:11px;color:#a3e635;font-weight:600;}
.ex-status{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:600;white-space:nowrap;}
.st-next{background:rgba(163,230,53,.15);color:#a3e635;}
.st-locked{background:rgba(255,255,255,.06);color:rgba(255,255,255,.3);}
.ex-arrow{width:20px;flex-shrink:0;}
.ex-arrow svg{width:16px;height:16px;stroke:rgba(255,255,255,.25);fill:none;stroke-width:2;}
.tp-list-head{margin-bottom:16px;}
.tp-list-head h2{font-size:18px;font-weight:800;color:#fff;}
.tp-list-head p{font-size:12px;color:rgba(255,255,255,.35);margin-top:3px;}

/* ── GAME AREA (right panel in game view) ───────────────── */
.gm-type-tag{
  display:flex;align-items:center;gap:7px;
  font-size:10px;font-weight:600;color:#7c3aed;
  text-transform:uppercase;letter-spacing:1.2px;
  margin-bottom:4px;
}
.gm-type-tag svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
.gm-card{
  flex:1;
  background:rgba(255,255,255,.03);
  border:0.5px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:22px 26px;
  display:flex;
  flex-direction:column;
  gap:14px;
  overflow:hidden;
  min-height:0;
}
.gm-instruction{font-size:13px;color:rgba(255,255,255,.45);line-height:1.6;}
.gm-question{font-size:16px;font-weight:700;color:rgba(255,255,255,.85);line-height:1.5;}
.gm-content{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:10px;}
.gm-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding-top:14px;
  border-top:0.5px solid rgba(255,255,255,.07);
  flex-shrink:0;
}
.gm-xp-tag{font-size:12px;color:rgba(255,255,255,.28);}
.gm-xp-tag b{color:rgba(255,255,255,.65);}
.gm-btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;border:none;}
.gm-btn-verify{background:#fff;color:#08071a;}
.gm-btn-next{background:#7c3aed;color:#fff;}
.gm-btn-verify svg,.gm-btn-next svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;}
.gm-feedback{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;border-radius:12px;
  font-size:13px;font-weight:600;
  margin-top:2px;
  opacity:0;pointer-events:none;
  transition:opacity .2s;
  flex-shrink:0;
}
.gm-feedback.show{opacity:1;pointer-events:auto;}
.gm-feedback.ok{background:rgba(16,185,129,.12);color:#6ee7b7;border:0.5px solid rgba(16,185,129,.3);}
.gm-feedback.bad{background:rgba(239,68,68,.12);color:#fca5a5;border:0.5px solid rgba(239,68,68,.3);}
.gm-fb-ico{width:20px;height:20px;flex-shrink:0;}
.gm-fb-ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.5;}

/* ── MC ─────────────────────────────────────────────────── */
.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.mc-opt{
  padding:13px 16px;border-radius:13px;
  background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);
  font-size:14px;font-weight:600;color:rgba(255,255,255,.7);
  cursor:pointer;text-align:left;transition:all .18s;
  display:flex;align-items:center;gap:12px;
}
.mc-opt:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18);}
.mc-opt.selected{background:rgba(124,58,237,.18);border-color:#7c3aed;color:#c4b5fd;}
.mc-opt.correct{background:rgba(16,185,129,.15)!important;border-color:#10b981!important;color:#6ee7b7!important;}
.mc-opt.wrong{background:rgba(239,68,68,.15)!important;border-color:#ef4444!important;color:#fca5a5!important;}
.mc-idx{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}

/* ── MATCH ──────────────────────────────────────────────── */
.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.match-col{display:flex;flex-direction:column;gap:7px;}
.match-item{
  padding:10px 14px;border-radius:12px;
  background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);
  font-size:13px;font-weight:600;color:rgba(255,255,255,.7);
  cursor:pointer;transition:all .15s;
}
.match-item:hover{background:rgba(255,255,255,.07);}
.match-item.sel{background:rgba(124,58,237,.2);border-color:#7c3aed;color:#c4b5fd;}
.match-item.linked{background:rgba(16,185,129,.12);border-color:#10b981;color:#6ee7b7;pointer-events:none;}
.match-item.wrong-flash{background:rgba(239,68,68,.15);border-color:#ef4444;}

/* ── FILL ───────────────────────────────────────────────── */
.fill-sent{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:15px;color:rgba(255,255,255,.8);margin-bottom:10px;}
.fill-blank{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:70px;height:32px;padding:0 10px;
  border-radius:8px;border:1.5px dashed rgba(255,255,255,.2);
  background:rgba(255,255,255,.04);
  font-size:14px;font-weight:700;color:#fff;
  cursor:pointer;
}
.fill-blank.filled{border-style:solid;border-color:#7c3aed;background:rgba(124,58,237,.15);}
.fill-blank.correct{border-color:#10b981!important;background:rgba(16,185,129,.15)!important;color:#6ee7b7!important;}
.fill-blank.wrong{border-color:#ef4444!important;background:rgba(239,68,68,.15)!important;color:#fca5a5!important;}
.fill-bank{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;}
.fill-word{
  padding:7px 14px;border-radius:10px;
  background:rgba(255,255,255,.07);border:0.5px solid rgba(255,255,255,.12);
  font-size:13px;font-weight:600;color:rgba(255,255,255,.75);
  cursor:pointer;transition:all .15s;
}
.fill-word:hover{background:rgba(255,255,255,.12);}
.fill-word.used{opacity:.3;pointer-events:none;}

/* ── ORDER ──────────────────────────────────────────────── */
.wo-group{margin-bottom:16px;}
.wo-answer{
  min-height:44px;background:rgba(255,255,255,.03);border-radius:10px;
  border:1.5px dashed rgba(255,255,255,.15);
  display:flex;flex-wrap:wrap;gap:6px;padding:8px;margin-bottom:8px;
}
.wo-bank{display:flex;flex-wrap:wrap;gap:6px;}
.wo-tile{
  padding:8px 14px;border-radius:9px;
  background:rgba(255,255,255,.07);border:0.5px solid rgba(255,255,255,.12);
  font-size:13px;font-weight:600;color:rgba(255,255,255,.8);
  cursor:pointer;transition:all .15s;
}
.wo-tile:hover{background:rgba(255,255,255,.12);}
.wo-tile.ok{background:rgba(16,185,129,.15)!important;border-color:#10b981!important;color:#6ee7b7!important;}
.wo-tile.bad{background:rgba(239,68,68,.15)!important;border-color:#ef4444!important;color:#fca5a5!important;}

/* ── FIX ────────────────────────────────────────────────── */
.ef-group{margin-bottom:16px;}
.ef-sentence{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center;}
.ef-word-btn{
  padding:7px 12px;border-radius:8px;
  background:rgba(255,255,255,.05);border:0.5px solid rgba(255,255,255,.1);
  font-size:14px;font-weight:600;color:rgba(255,255,255,.75);
  cursor:default;
}
.ef-word-btn.hint{border-color:#7c3aed;color:#c4b5fd;cursor:pointer;}
.ef-word-btn.hint:hover{background:rgba(124,58,237,.15);}
.ef-word-btn.hint.sel{background:rgba(124,58,237,.25);}
.ef-word-btn.correct-word{background:rgba(16,185,129,.15)!important;border-color:#10b981!important;color:#6ee7b7!important;cursor:default!important;}
.ef-choices{display:flex;flex-wrap:wrap;gap:7px;}
.ef-choice{
  padding:7px 14px;border-radius:9px;
  background:rgba(255,255,255,.06);border:0.5px solid rgba(255,255,255,.12);
  font-size:13px;font-weight:600;color:rgba(255,255,255,.7);
  cursor:pointer;transition:all .15s;
}
.ef-choice:hover{background:rgba(255,255,255,.1);}
.ef-choices.hidden{display:none;}

/* ── TRANSLATE ──────────────────────────────────────────── */
.tr-item{margin-bottom:12px;}
.tr-src{font-size:18px;font-weight:800;color:var(--ink,#fff);margin-bottom:8px;letter-spacing:.3px;}
.tr-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.tr-opt{padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.04);
  border:1.5px solid rgba(255,255,255,.1);font-size:13px;font-weight:600;color:rgba(255,255,255,.7);
  cursor:pointer;text-align:center;transition:all .18s;}
.tr-opt:hover{background:rgba(255,255,255,.07);}
.tr-opt.selected{background:rgba(124,58,237,.18);border-color:#7c3aed;color:#c4b5fd;}
.tr-opt.correct{background:rgba(16,185,129,.15)!important;border-color:#10b981!important;color:#6ee7b7!important;}
.tr-opt.wrong{background:rgba(239,68,68,.15)!important;border-color:#ef4444!important;color:#fca5a5!important;}

/* ── SCRAMBLE ───────────────────────────────────────────── */
.scr-item{margin-bottom:16px;padding:14px 16px;background:rgba(255,255,255,.03);border-radius:14px;border:0.5px solid rgba(255,255,255,.08);}
.scr-hint{font-size:11px;color:rgba(255,255,255,.3);margin-bottom:10px;}
.scr-answer{min-height:42px;background:rgba(255,255,255,.04);border-radius:9px;border:1.5px dashed rgba(255,255,255,.15);
  display:flex;flex-wrap:wrap;gap:5px;padding:6px;margin-bottom:10px;align-items:center;}
.scr-bank{display:flex;flex-wrap:wrap;gap:6px;}
.scr-tile{padding:8px 14px;border-radius:9px;background:rgba(124,58,237,.18);
  border:1.5px solid #7c3aed;color:#c4b5fd;font-size:16px;font-weight:800;
  cursor:pointer;transition:all .18s;letter-spacing:.8px;}
.scr-tile:hover{background:rgba(124,58,237,.3);}
.scr-tile.placed{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18);color:rgba(255,255,255,.8);}
.scr-tile.ok{background:rgba(16,185,129,.2)!important;border-color:#10b981!important;color:#6ee7b7!important;}
.scr-tile.bad{background:rgba(239,68,68,.2)!important;border-color:#ef4444!important;color:#fca5a5!important;}

/* ── UNAVAILABLE ────────────────────────────────────────── */
.tp-unavailable{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;text-align:center;color:rgba(255,255,255,.4);}
.tp-unavailable h2{font-size:20px;color:rgba(255,255,255,.7);}
.tp-unavailable p{font-size:14px;}
.tp-unavailable a{color:#a78bfa;font-size:13px;}

/* ── RESULTS ────────────────────────────────────────────── */
.gm-results{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:20px;text-align:center;padding:20px;}
.gm-result-score{font-size:56px;font-weight:900;color:#fff;line-height:1;}
.gm-result-label{font-size:13px;color:rgba(255,255,255,.4);}
.gm-result-msg{font-size:18px;font-weight:700;color:#a3e635;}
.gm-result-actions{display:flex;gap:12px;margin-top:8px;}

@media(max-width:900px){
  :root{--side-w:220px;}
  .tr-opts{grid-template-columns:1fr 1fr;}
}
@media(max-width:680px){
  .tp-page{left:0;}
  .tp-side{display:none;}
  .tp-main{padding:16px;}
  .mc-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="tp-page">

  <!-- LEFT PANEL -->
  <div class="tp-side" id="tpSide">
    <div class="tp-side-img" id="tpSideImg"></div>
    <div class="tp-side-info" id="tpSideInfo"></div>
    <div class="tp-side-foot">
      <a class="tp-back" id="tpBack" href="progreso.html">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        <span>Volver al camino</span>
      </a>
    </div>
  </div>

  <!-- MAIN PANEL (populated by JS) -->
  <div class="tp-main" id="tpBody"></div>

</div>

<!-- ═══ SCRIPTS ══════════════════════════════════════════════ -->

/* ════════════════════════════════════════════════════════

function enterTopic(t){
  STATE={view:'game',topic:t,step:0,score:0,checked:false};
  const rc=RM[t.rank]||'#cd7f32';
  document.documentElement.style.setProperty('--rank-color',rc);

  /* ── left panel ── */
  sideImg.innerHTML='';
  const hImg=new Image();
  hImg.src=t.img;hImg.alt='';hImg.loading='eager';hImg.onerror=()=>hImg.remove();
  sideImg.appendChild(hImg);

  const games=getGames(t.id);
  const totalXp=games?games.reduce((s,g)=>s+g.xp,0):t.xp;
  const lines=t.title.split('\n');

    <div class="tp-side-chips">
      <span class="tp-pill tp-pill-rank"><span class="tp-pill-dot"></span>${t.rank}</span>

function getGames(id){ return id===1?GAMES1:null; }

function renderStep(){
  const games=getGames(STATE.topic.id);
  if(!games){
    body.innerHTML=`<div class="tp-unavailable"><div class="tp-unavailable-ico"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div><h2>Próximamente</h2><p>Los juegos de este tema estarán disponibles pronto.</p><a href="#" onclick="renderList();return false;">← Volver a temas</a></div>`;
    return;
  }
  STATE.checked=false;
  const g=games[STATE.step];

  /* update side dots */
  const sideDots=ISA('#sideDots .tp-side-dot');
  sideDots.forEach((d,i)=>{
    d.className='tp-side-dot'+(i<STATE.step?' done':i===STATE.step?' active':'');
  });
  /* steps track */
  const stepsHtml=games.map((_,i)=>{
    let c='gm-step';
    if(i<STATE.step)c+=' done';
    else if(i===STATE.step)c+=' active';
    return`<div class="${c}"></div>`;
  }).join('');

  const STEP_ICONS={
    mc:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg>`,
    match:`<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.72-1.71"></path></svg>`,
    fill:`<svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 1 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>`,
    order:`<svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="15" y2="12"></line><line x1="3" y1="18" x2="9" y2="18"></line></svg>`,
    fix:`<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>`,
    translate:`<svg viewBox="0 0 24 24"><path d="M5 8l6 6"></path><path d="M4 14l6-6 2-3"></path><path d="M2 5h12"></path><path d="M7 2h1"></path><path d="M22 22l-5-10-5 10"></path><path d="M14 18h6"></path></svg>`,
    scramble:`<svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>`,
  };

  let inner='';
  if(g.id==='mc')    inner=buildMC(g);
  if(g.id==='match') inner=buildMatch(g);
  if(g.id==='fill')  inner=buildFill(g);
  if(g.id==='order') inner=buildOrder(g);
  if(g.id==='fix')       inner=buildFix(g);
  if(g.id==='translate') inner=buildTranslate(g);
  if(g.id==='scramble')  inner=buildScramble(g);

  const verifyStyle=g.id==='match'?'display:none':'';
  body.innerHTML=`
    <div class="gm-steps">${stepsHtml}</div>
    <div class="gm-card-wrap">
      <div class="gm-card">
        <div class="gm-type-tag">${STEP_ICONS[g.id]||''}Paso ${STATE.step+1} de ${games.length} · ${g.label}</div>
        ${inner}
        <div class="gm-feedback" id="gmFB">
          <div class="gm-fb-ico" id="gmFBIco"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
          <div class="gm-fb-txt" id="gmFBTxt"></div>
        </div>
        <div class="gm-footer">
          <div class="gm-xp-tag">XP acumulado: <b id="gmXP">${STATE.score}</b></div>

            </button>
            <button class="gm-btn gm-btn-next" id="gmNext" style="display:none" onclick="gmNext()">
              ${STATE.step<games.length-1?'Continuar':'Ver resultados'}
              <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
          </div>
        </div>
      </div>
    </div>`;
}

/* ── build functions ──────────────────────────────────── */
function buildMC(g){
  const L=['A','B','C','D'];
  return`<div class="gm-q">${g.q}</div>
    <div class="mc-grid">${g.opts.map((o,i)=>`<button class="mc-opt" id="mc${i}" onclick="_mcSel(${i})">`+
      `<span class="mc-opt-letter">${L[i]}</span>${o}</button>`).join('')}</div>`;
}

function buildMatch(g){
  const right=shuffle(g.pairs.map((p,i)=>({t:p[1],i})));
  return`<p class="gm-instruction">${g.instr}</p>
    <div class="match-cols">
      <div class="match-col"><div class="match-col-lbl">Pronombres</div>
        ${g.pairs.map((p,i)=>`<div class="match-item" id="mL${i}" data-side="L" data-i="${i}" onclick="_mClick(this)">${p[0]}</div>`).join('')}
      </div>
      <div class="match-col"><div class="match-col-lbl">Significado en español</div>
        ${right.map(r=>`<div class="match-item" id="mR${r.i}" data-side="R" data-i="${r.i}" onclick="_mClick(this)">${r.t}</div>`).join('')}
      </div>
    </div>`;
}

function buildFill(g){
  return`<p class="gm-instruction">${g.instr}</p>`+
    g.sents.map((s,i)=>`<div class="fb-group">
      <div class="fb-row">
        <span class="fb-num">${i+1}.</span>
        <span class="fb-text">${s.pre}<span class="fb-blank" id="fbB${i}" data-ans="${s.ans}" data-i="${i}" onclick="_fbClear(${i})">___</span>${s.post}</span>
      </div>
      <div class="fb-bank" id="fbBnk${i}">
        ${shuffle([...s.bank]).map(w=>`<div class="fb-word" data-w="${w}" onclick="_fbPick(${i},this)">${w}</div>`).join('')}
      </div>
    </div>`).join('');
}

function buildOrder(g){
  return`<p class="gm-instruction">${g.instr}</p>`+
    g.sents.map((s,i)=>`<div class="wo-group" id="woG${i}">
      <div class="wo-lbl">Tu respuesta</div>
      <div class="wo-zone wo-ans-zone" id="woA${i}"></div>
      <div class="wo-lbl" style="margin-top:10px">Palabras</div>
      <div class="wo-zone wo-bank-zone" id="woB${i}">
        ${shuffle([...s.words]).map(w=>`<div class="wo-tile" data-w="${w}" onclick="_woClick(this,${i},'b')">${w}</div>`).join('')}
      </div>
    </div>`).join('');
}

function buildFix(g){
  return`<p class="gm-instruction">${g.instr}</p>`+
    g.sents.map((s,si)=>`<div class="ef-group" id="efG${si}">
      <div class="ef-sentence">
        ${s.words.map((w,wi)=>`<button class="ef-word-btn${wi===s.wi?' hint':''}" data-si="${si}" data-wi="${wi}" onclick="_efClick(${si},${wi})">${w}</button> `).join('')}
      </div>
      <div class="ef-choices" id="efC${si}">
        ${s.choices.map(c=>`<div class="ef-choice" onclick="_efPick(${si},'${c}','${s.correct}')">${c}</div>`).join('')}
      </div>
    </div>`).join('');
}

/* -- translate ------------------------------------------------ */
let _trSel={};
function buildTranslate(g){
  _trSel={};
  return'<p class="gm-instruction">'+g.instr+'</p>'+
    g.items.map(function(it,i){
      return'<div class="tr-item" id="trItem'+i+'">'+
        '<div class="tr-src">'+it.src+'</div>'+
        '<div class="tr-opts">'+
          it.opts.map(function(o,oi){
            return'<button class="tr-opt" data-i="'+i+'" data-oi="'+oi+'" onclick="_trClick('+i+','+oi+')">'+o+'</button>';
          }).join('')+
        '</div></div>';
    }).join('');
}
window._trClick=function(i,oi){
  if(STATE.checked)return;
  _trSel[i]=oi;
  ISA('[data-i="'+i+'"].tr-opt').forEach(function(el,idx){el.classList.toggle('selected',idx===oi);});
};

/* -- scramble ------------------------------------------------- */
function buildScramble(g){
  return'<p class="gm-instruction">'+g.instr+'</p>'+
    g.words.map(function(w,i){
      return'<div class="scr-item" id="scrItem'+i+'">'+
        '<div class="scr-hint">&#128161; '+w.hint+'</div>'+
        '<div class="scr-answer" id="scrAns'+i+'"></div>'+
        '<div class="scr-bank" id="scrBank'+i+'">'+
          w.scrambled.map(function(l,li){
            return'<button class="scr-tile" data-li="'+li+'" onclick="_scrPlace('+i+','+li+',this)">'+l+'</button>';
          }).join('')+
        '</div></div>';
    }).join('');
}
window._scrPlace=function(wi,li,btn){
  if(STATE.checked)return;
  var ans=I('scrAns'+wi);
  var tile=document.createElement('button');
  tile.className='scr-tile placed';
  tile.textContent=btn.textContent;
  tile.dataset.li=li;
  tile.onclick=function(){_scrRemove(wi,li,this);};
  ans.appendChild(tile);
  btn.style.visibility='hidden';btn.disabled=true;
};
window._scrRemove=function(wi,li,tile){
  if(STATE.checked)return;
  var orig=I('scrBank'+wi).querySelector('[data-li="'+li+'"]');
  if(orig){orig.style.visibility='visible';orig.disabled=false;}
  tile.remove();
};

/* ── interaction handlers ─────────────────────────────── */
var _mcSel=null,_mSel=null,_mDone=0,_efDone={};

window._mcSel=function(i){
  if(STATE.checked)return;
  _mcSel=i;
  ISA('.mc-opt').forEach((el,j)=>{
    el.classList.toggle('sel',j===i);
    el.style.opacity=j===i?'1':'0.55';
  });
};

window._mClick=function(el){
  if(el.classList.contains('matched'))return;
  const side=el.dataset.side;
  if(!_mSel){
    ISA('.match-item').forEach(e=>e.classList.remove('sel'));
    el.classList.add('sel');_mSel=el;return;
  }
  if(_mSel.dataset.side===side){
    ISA('.match-item').forEach(e=>e.classList.remove('sel'));
    el.classList.add('sel');_mSel=el;return;
  }
  const ia=parseInt(_mSel.dataset.i),ib=parseInt(el.dataset.i);
  if(ia===ib){
    _mSel.classList.remove('sel');_mSel.classList.add('matched');
    el.classList.add('matched');_mDone++;_mSel=null;
    const tot=ISA('.match-item[data-side="L"]').length;
    if(_mDone>=tot){
      STATE.score+=30;STATE.checked=true;
      showFB(true,'¡Perfecto! Todos los pares correctos. +30 XP');
      showNext();
    }
  } else {
    el.classList.add('shake');_mSel.classList.add('shake');
    setTimeout(()=>{el.classList.remove('shake','sel');_mSel&&_mSel.classList.remove('shake','sel');_mSel=null;},500);
  }
};

window._fbPick=function(gi,wordEl){
  if(STATE.checked)return;
  const blank=I('fbB'+gi);
  if(blank.dataset.filled==='1')return;
  const w=wordEl.dataset.w;
  blank.textContent=w;blank.dataset.filled='1';
  wordEl.classList.add('used');
};

window._fbClear=function(gi){
  if(STATE.checked)return;
  const blank=I('fbB'+gi);
  if(blank.dataset.filled!=='1')return;
  const w=blank.textContent;
  blank.textContent='___';blank.dataset.filled='0';
  const bank=I('fbBnk'+gi);
  if(bank){const wd=bank.querySelector(`.fb-word[data-w="${w}"]`);if(wd)wd.classList.remove('used');}
};

window._woClick=function(el,gi,zone){
  if(STATE.checked)return;
  const w=el.dataset.w;el.remove();
  if(zone==='b'){
    const a=I('woA'+gi);
    const t=document.createElement('div');
    t.className='wo-tile';t.dataset.w=w;t.textContent=w;
    t.setAttribute('onclick',`_woClick(this,${gi},'a')`);
    a.appendChild(t);
  } else {
    const b=I('woB'+gi);
    const t=document.createElement('div');
    t.className='wo-tile';t.dataset.w=w;t.textContent=w;
    t.setAttribute('onclick',`_woClick(this,${gi},'b')`);
    b.appendChild(t);
  }
};

window._efClick=function(si,wi){
  const _games=getGames(STATE.topic.id);
  const g=_games[STATE.step];
  if(wi!==g.sents[si].wi)return;
  ISA(`[data-si="${si}"]`).forEach(b=>b.classList.remove('selected'));
  const btn=document.querySelector(`[data-si="${si}"][data-wi="${wi}"]`);
  if(btn)btn.classList.add('selected');
  const ch=I('efC'+si);if(ch)ch.classList.add('show');
};

window._efPick=function(si,chosen,correct){
  if(_efDone[si])return;
  const btn=document.querySelector(`[data-si="${si}"].selected`);
  if(!btn)return;
  if(chosen===correct){
    btn.textContent=chosen;btn.classList.remove('selected','hint');btn.classList.add('fixed');
    const ch=I('efC'+si);if(ch)ch.classList.remove('show');
    _efDone[si]=true;
  } else {
    btn.style.animation='none';
    requestAnimationFrame(()=>btn.style.animation='gmShake .36s ease');
  }
};

/* ── verify ───────────────────────────────────────────── */
window.gmVerify=function(){
  if(STATE.checked)return;
  const _games=getGames(STATE.topic.id);
  const g=_games[STATE.step];

  if(g.id==='mc'){
    if(_mcSel===null)return;
    const ok=_mcSel===g.correct;
    ISA('.mc-opt').forEach((el,i)=>{
      el.style.opacity='1';
      if(i===g.correct)el.classList.add('correct');
      else if(i===_mcSel&&!ok)el.classList.add('wrong');
    });
    STATE.checked=true;
    if(ok){STATE.score+=g.xp;showFB(true,`¡Correcto! +${g.xp} XP`);}
    else showFB(false,`La respuesta correcta era: ${g.opts[g.correct]}`);
    showNext();

  } else if(g.id==='fill'){
    let all=true;
    g.sents.forEach((_,i)=>{const b=I('fbB'+i);if(b&&b.dataset.filled!=='1')all=false;});
    if(!all)return;
    let cor=0;
    g.sents.forEach((s,i)=>{
      const b=I('fbB'+i);if(!b)return;
      if(b.textContent===s.ans){b.classList.add('correct');cor++;}
      else b.classList.add('wrong');
    });
    STATE.checked=true;
    const tot=g.sents.length;
    if(cor===tot){STATE.score+=g.xp;showFB(true,`¡Perfecto! +${g.xp} XP`);}
    else showFB(false,`${cor} de ${tot} correctos. Revisa los resaltados en rojo.`);
    showNext();

  } else if(g.id==='order'){
    let allOk=true;
    g.sents.forEach((s,si)=>{
      const ansEl=I('woA'+si);if(!ansEl)return;
      const got=Array.from(ansEl.querySelectorAll('.wo-tile')).map(t=>t.textContent);
      const ok=got.join(' ')===s.ans.join(' ');
      if(!ok)allOk=false;
      ansEl.querySelectorAll('.wo-tile').forEach(t=>{t.classList.add(ok?'ok':'bad');});
      const bEl=I('woB'+si);
      if(bEl)bEl.querySelectorAll('.wo-tile').forEach(t=>{t.classList.add(ok?'ok':'bad');t.style.pointerEvents='none';});
    });
    STATE.checked=true;
    if(allOk){STATE.score+=g.xp;showFB(true,`¡Excelente! +${g.xp} XP`);}
    else showFB(false,'Alguna oración no está en el orden correcto.');
    showNext();

  } else if(g.id==='fix'){
    const all=g.sents.every((_,i)=>_efDone[i]);
    if(!all)return;
    STATE.checked=true;STATE.score+=g.xp;
    showFB(true,`¡Todos los errores corregidos! +${g.xp} XP`);
    showNext();

  } else if(g.id==='translate'){
    if(Object.keys(_trSel).length<g.items.length)return;
    let cor=0;
    g.items.forEach((it,i)=>{
      const sel=_trSel[i];
      ISA('[data-i="'+i+'"].tr-opt').forEach((el,oi)=>{
        el.style.opacity='1';
        if(oi===it.correct)el.classList.add('correct');
        else if(oi===sel&&sel!==it.correct)el.classList.add('wrong');
      });
      if(sel===it.correct)cor++;
    });
    STATE.checked=true;
    if(cor===g.items.length){STATE.score+=g.xp;showFB(true,`¡Perfecto! +${g.xp} XP`);}
    else showFB(false,`${cor} de ${g.items.length} correctos.`);
    showNext();

  } else if(g.id==='scramble'){
    let allFilled=true;
    g.words.forEach((_,i)=>{const a=I('scrAns'+i);if(!a||a.querySelectorAll('.scr-tile').length===0)allFilled=false;});
    if(!allFilled)return;
    let allOk=true;
    g.words.forEach((w,i)=>{
      const placed=Array.from(I('scrAns'+i).querySelectorAll('.scr-tile')).map(t=>t.textContent);
      const ok=placed.join('')===w.ans;
      if(!ok)allOk=false;
      I('scrAns'+i).querySelectorAll('.scr-tile').forEach(t=>t.classList.add(ok?'ok':'bad'));
    });
    STATE.checked=true;
    if(allOk){STATE.score+=g.xp;showFB(true,`¡Perfecto! +${g.xp} XP`);}
    else showFB(false,'Alguna palabra no es correcta.');
    showNext();
  }
};

function showFB(ok,msg){
  const fb=I('gmFB'),ico=I('gmFBIco'),txt=I('gmFBTxt');
  if(!fb)return;
  fb.className='gm-feedback show '+(ok?'ok':'bad');
  ico.innerHTML=ok
    ?'<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>'
    :'<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
  txt.textContent=msg;
  const xpEl=I('gmXP');if(xpEl)xpEl.textContent=STATE.score;
}

function showNext(){
  const v=I('gmVerify'),n=I('gmNext');
  if(v)v.style.display='none';
  if(n)n.style.display='inline-flex';
}

window.gmNext=function(){
  const games=getGames(STATE.topic.id);
  STATE.step++;
  _mcSel=null;_mSel=null;_mDone=0;_efDone={};
  if(STATE.step>=games.length)renderResults();
  else renderStep();
};

/* ── results ──────────────────────────────────────────── */
function renderResults(){
  const games=getGames(STATE.topic.id);
  const maxXp=games.reduce((s,g)=>s+g.xp,0);
  const pct=Math.round((STATE.score/maxXp)*100);
  const title=pct>=80?'¡Excelente trabajo!':pct>=50?'¡Buen esfuerzo!':'Sigue practicando';
  body.innerHTML=`
    <div style="padding:0 40px 100px">
      <div class="gm-card gm-results">
        <div class="gm-results-star"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></div>
        <div class="gm-results-title">${title}</div>
        <div class="gm-results-sub">${STATE.topic.sub} · completado</div>
        <div class="gm-results-stats">
          <div class="gm-rs"><div class="gm-rs-val">+${STATE.score}</div><div class="gm-rs-lbl">XP Ganado</div></div>
          <div class="gm-rs"><div class="gm-rs-val">${pct}%</div><div class="gm-rs-lbl">Precisión</div></div>
          <div class="gm-rs"><div class="gm-rs-val">${games.length}</div><div class="gm-rs-lbl">Juegos</div></div>
        </div>
        <div class="gm-results-btns">
          <button class="gm-btn-ghost" onclick="renderList()">← Ver temas</button>
          <button class="gm-btn gm-btn-next" onclick="renderList()">
            Siguiente tema <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
      </div>
    </div>`;
}

/* ── boot ─────────────────────────────────────────────── */
init();

try{if(window._aura&&window._aura.sb){
  window._aura.sb.auth.getSession().then(({data:{session}})=>{
    if(session&&window._aura.loadProfile)window._aura.loadProfile(session.user.id);
  });
}}catch(e){}

})();
</script>

</body>

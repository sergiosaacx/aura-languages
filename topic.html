<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tema — Aura Languages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   AURA · TOPIC DETAIL
   Neon lime · dark surfaces · mono labels
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  /* surfaces */
  --bg:        #0a0a0a;
  --bg-2:      #0d0d0d;
  --card:      #141414;
  --card-2:    #181818;
  --card-3:    #1a1a1a;
  --line:      #232323;
  --line-2:    #2a2a2a;
  --line-3:    #333;

  /* ink */
  --ink:       #f5f5f5;
  --ink-2:     #c8c8c8;
  --ink-3:     #8a8a8a;
  --muted:     #6e6e6e;
  --muted-2:   #4a4a4a;

  /* accents */
  --accent:    #c4ff3d;
  --accent-d:  #a8e02f;
  --accent-rgb:196,255,61;
  --good:      #22c55e;
  --warn:      #fbbf24;
  --rose:      #fb7185;
  --violet:    #c084fc;
  --teal:      #5eead4;

  /* typography */
  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-body:    'Geist', system-ui, sans-serif;
  --font-mono:    'Geist Mono', ui-monospace, monospace;

  /* rank colors */
  --rk-bronce:    #cd7f32;
  --rk-plata:     #d1d5db;
  --rk-oro:       #fbbf24;
  --rk-platino:   #5eead4;
  --rk-diamante:  #60a5fa;
  --rk-challenger:#c084fc;
}

html,body{
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -.005em;
}

/* subtle backdrop */
body::before{
  content:"";
  position: fixed;
  inset: 0;
  background-image: radial-gradient(rgba(255,255,255,.022) 1px, transparent 1px);
  background-size: 24px 24px;
  pointer-events: none;
  z-index: 0;
}

/* ── PAGE WRAP ─────────────────────────────────────────────── */
.tp-page{
  position: relative;
  z-index: 1;
  padding-left: 76px; /* left sidebar clearance */
  min-height: 100vh;
}

/* ── TOP NAV BAR ───────────────────────────────────────────── */
.tp-topbar{
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 40px;
  background: linear-gradient(180deg, rgba(10,10,10,.85), rgba(10,10,10,0));
  backdrop-filter: blur(6px);
}
.tp-back{
  background:none;cursor:pointer;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: rgba(20,20,20,.7);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 999px;
  padding: 9px 16px 9px 12px;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-2);
  cursor: pointer;
  text-decoration: none;
  transition: background .2s, border-color .2s, transform .12s;
}
.tp-back:hover{
  background: rgba(196,255,61,.08);
  border-color: rgba(196,255,61,.25);
  color: var(--accent);
  transform: translateX(-2px);
}
.tp-back svg{
  width: 14px; height: 14px;
  stroke: currentColor; fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.tp-crumb{
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: .14em;
  text-transform: uppercase;
}
.tp-crumb b{ color: var(--ink-2); font-weight: 700; }

/* ── HERO CARD ─────────────────────────────────────────────── */
.tp-hero{
  position: relative;
  margin: 4px 40px 36px;
  border-radius: 24px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.06);
  min-height: 380px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  isolation: isolate;
}
.tp-hero-bg{
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}
.tp-hero-bg-fallback{
  position: absolute;
  inset: 0;
  background: linear-gradient(155deg, #1a1a1a 0%, #2a2a2a 55%, #0d0d0d 100%);
  z-index: 0;
}
.tp-hero-bg img{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
  opacity: 0;
  animation: heroFadeIn .8s ease forwards;
  transform: scale(1.04);
}
@keyframes heroFadeIn{
  to { opacity: 1; transform: scale(1); }
}
.tp-hero-bg::after{
  content:"";
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background:
    linear-gradient(to top, rgba(10,10,10,.96) 0%, rgba(10,10,10,.65) 45%, rgba(10,10,10,.25) 70%, transparent 100%),
    linear-gradient(to right, rgba(10,10,10,.4) 0%, transparent 40%);
}

.tp-hero-content{
  position: relative;
  z-index: 3;
  padding: 48px 44px 36px;
}

.tp-hero-pills{
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}
.tp-pill{
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 6px 12px 6px 9px;
  border-radius: 999px;
  background: rgba(20,20,20,.6);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.1);
  color: var(--ink-2);
}
.tp-pill svg{
  width: 12px; height: 12px;
  stroke: currentColor; fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.tp-pill.tp-pill-rank{
  background: rgba(20,20,20,.6);
  border-color: rgba(255,255,255,.12);
}
.tp-pill.tp-pill-rank .tp-pill-dot{
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--rank-color, #cd7f32);
  box-shadow: 0 0 8px var(--rank-color, #cd7f32);
}
.tp-pill.tp-pill-cefr{
  background: var(--rank-color);
  color: #0a0a0a;
  border-color: transparent;
}
.tp-pill.tp-pill-type{
  font-family: var(--font-body);
  font-size: 12px;
  letter-spacing: -.005em;
  text-transform: none;
  font-weight: 600;
  color: var(--ink);
}
.tp-pill-glyph{
  font-family: var(--font-display);
  font-size: 13px;
  color: rgba(255,255,255,.7);
}

.tp-title{
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(2.6rem, 4.6vw, 3.8rem);
  line-height: .95;
  letter-spacing: -.035em;
  color: #fff;
  text-transform: uppercase;
  margin-bottom: 12px;
  text-shadow: 0 4px 24px rgba(0,0,0,.5);
}
.tp-sub{
  font-family: var(--font-mono);
  font-size: 13.5px;
  font-weight: 600;
  color: rgba(255,255,255,.7);
  letter-spacing: .06em;
  text-transform: uppercase;
  margin-bottom: 28px;
}

/* hero stats row */
.tp-stats{
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}
.tp-stat{
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 18px 11px 13px;
  background: rgba(20,20,20,.55);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 14px;
}
.tp-stat-ico{
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.08);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-2);
  flex-shrink: 0;
}
.tp-stat.s-accent .tp-stat-ico{
  background: rgba(196,255,61,.12);
  border-color: rgba(196,255,61,.3);
  color: var(--accent);
}
.tp-stat.s-warn .tp-stat-ico{
  background: rgba(251,191,36,.12);
  border-color: rgba(251,191,36,.3);
  color: var(--warn);
}
.tp-stat-ico svg{
  width: 14px; height: 14px;
  stroke: currentColor; fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.tp-stat-text{ line-height: 1.1; }
.tp-stat-val{
  font-family: var(--font-display);
  font-size: 1.05rem;
  font-weight: 700;
  color: #fff;
  letter-spacing: -.01em;
}
.tp-stat-lbl{
  margin-top: 3px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 600;
  color: rgba(255,255,255,.55);
  letter-spacing: .14em;
  text-transform: uppercase;
}

/* hero progress bar */
.tp-progress{
  max-width: 480px;
}
.tp-progress-bar{
  height: 6px;
  background: rgba(0,0,0,.45);
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 999px;
  overflow: hidden;
  position: relative;
}
.tp-progress-fill{
  height: 100%;
  background: linear-gradient(90deg, var(--accent-d), var(--accent));
  border-radius: 999px;
  box-shadow: 0 0 12px rgba(196,255,61,.5);
  position: relative;
  transition: width .6s cubic-bezier(.2,.8,.2,1);
}
.tp-progress-fill::after{
  content:"";
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 30%, rgba(255,255,255,.45) 50%, transparent 70%);
  animation: shimmer 2.4s ease-in-out infinite;
}
@keyframes shimmer{
  0%{ transform: translateX(-100%); }
  100%{ transform: translateX(100%); }
}

/* ── BODY ──────────────────────────────────────────────────── */
.tp-body{
  padding: 0 40px 100px;
  max-width: 920px;
}

/* section header */
.tp-section-head{
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
  position: relative;
}
.tp-section-head::after{
  content:"";
  position: absolute;
  left: 0; bottom: -1px;
  width: 60px;
  height: 1px;
  background: linear-gradient(90deg, var(--accent), transparent);
  box-shadow: 0 0 8px rgba(196,255,61,.6);
}
.tp-section-label{
  font-family: var(--font-display);
  font-size: 1.45rem;
  font-weight: 800;
  letter-spacing: -.025em;
  color: var(--ink);
  display: flex;
  align-items: baseline;
  gap: 12px;
}
.tp-section-label small{
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: .14em;
  text-transform: uppercase;
}
.tp-section-meta{
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: .12em;
  text-transform: uppercase;
}

.tp-section + .tp-section{ margin-top: 36px; }

/* ── EXERCISE LIST ─────────────────────────────────────────── */
.ex-list{
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* single exercise item */
.ex-item{
  display: grid;
  grid-template-columns: 38px 52px 1fr auto auto;
  align-items: center;
  gap: 16px;
  padding: 14px 18px 14px 14px;
  border-radius: 16px;
  background: linear-gradient(180deg, var(--card-2), var(--card));
  border: 1px solid var(--line);
  cursor: pointer;
  text-decoration: none;
  transition: background .18s, border-color .2s, transform .15s, box-shadow .2s;
  position: relative;
  overflow: hidden;
}
.ex-item::before{
  content:"";
  position: absolute;
  left: 0; top: 12px; bottom: 12px;
  width: 2px;
  border-radius: 0 2px 2px 0;
  background: transparent;
  transition: background .2s;
}
.ex-item:hover{
  background: linear-gradient(180deg, var(--card-3), var(--card-2));
  border-color: var(--line-2);
  transform: translateX(2px);
}
.ex-item:hover::before{
  background: rgba(196,255,61,.4);
}

/* number column */
.ex-num{
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: .04em;
  text-align: center;
}
.ex-item[data-status="next"] .ex-num{
  color: var(--accent);
  text-shadow: 0 0 10px rgba(196,255,61,.5);
}
.ex-item[data-status="done"] .ex-num{ color: var(--good); }

/* icon column */
.ex-icon{
  width: 48px;
  height: 48px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--line-2);
  color: var(--ink-2);
  transition: transform .2s;
}
.ex-icon svg{
  width: 19px; height: 19px;
  stroke: currentColor; fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.ex-item:hover .ex-icon{ transform: scale(1.05) rotate(-2deg); }

/* text column */
.ex-text{ min-width: 0; }
.ex-name{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: -.015em;
  color: var(--ink);
  margin-bottom: 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ex-meta{
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.ex-chip{
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--line-2);
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  color: var(--ink-3);
  letter-spacing: .08em;
  text-transform: uppercase;
}
.ex-chip-dot{
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--chip-color, var(--muted));
}
.ex-time{
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: .04em;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.ex-time svg{
  width: 11px; height: 11px;
  stroke: currentColor; fill: none;
  stroke-width: 2;
}
.ex-xp{
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: .04em;
}

/* status column */
.ex-status{
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 5px 11px;
  border-radius: 999px;
  white-space: nowrap;
}
.ex-status.st-next{
  background: linear-gradient(180deg, #c4ff3d, #a8e02f);
  color: #0a0a0a;
  box-shadow: 0 2px 10px rgba(196,255,61,.4);
}
.ex-status.st-done{
  background: rgba(34,197,94,.12);
  border: 1px solid rgba(34,197,94,.3);
  color: var(--good);
}
.ex-status.st-locked{
  background: rgba(255,255,255,.04);
  color: var(--muted);
  border: 1px solid var(--line);
}

/* arrow column */
.ex-arrow{
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--line-2);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-3);
  transition: all .2s;
}
.ex-arrow svg{
  width: 13px; height: 13px;
  stroke: currentColor; fill: none;
  stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
}
.ex-item:hover .ex-arrow{
  background: rgba(196,255,61,.12);
  border-color: rgba(196,255,61,.3);
  color: var(--accent);
  transform: translateX(2px);
}

/* ── TOOL ITEMS (Herramientas Aura) ────────────────────────── */
.ex-item.tool-item{
  background:
    linear-gradient(180deg, rgba(196,255,61,.06), rgba(196,255,61,.02)),
    linear-gradient(180deg, var(--card-2), var(--card));
  border-color: rgba(196,255,61,.18);
}
.ex-item.tool-item::before{
  background: linear-gradient(180deg, var(--accent), var(--accent-d));
  box-shadow: 0 0 12px rgba(196,255,61,.6);
}
.ex-item.tool-item:hover{
  background:
    linear-gradient(180deg, rgba(196,255,61,.1), rgba(196,255,61,.04)),
    linear-gradient(180deg, var(--card-3), var(--card-2));
  border-color: rgba(196,255,61,.32);
  box-shadow: 0 8px 24px rgba(196,255,61,.08);
}
.ex-item.tool-item .ex-icon{
  background: rgba(196,255,61,.1);
  border-color: rgba(196,255,61,.3);
  color: var(--accent);
}
.ex-item.tool-item .ex-name{ color: #fff; }
.ex-item.tool-item .ex-arrow{
  background: rgba(196,255,61,.12);
  border-color: rgba(196,255,61,.3);
  color: var(--accent);
}

/* ── NOT AVAILABLE STATE ───────────────────────────────────── */
.tp-unavailable{
  margin: 0 40px;
  padding: 64px 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  text-align: center;
  background: linear-gradient(180deg, var(--card-2), var(--card));
  border: 1px dashed var(--line-2);
  border-radius: 18px;
}
.tp-unavailable-ico{
  width: 64px; height: 64px;
  border-radius: 18px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--line-2);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
}
.tp-unavailable-ico svg{ width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 1.5; }
.tp-unavailable h2{
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.6rem;
  letter-spacing: -.02em;
  color: var(--ink);
}
.tp-unavailable p{
  color: var(--ink-3);
  font-size: 14px;
  max-width: 360px;
  line-height: 1.6;
}
.tp-unavailable a{
  margin-top: 8px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--accent);
  color: #0a0a0a;
  font-family: var(--font-body);
  font-weight: 700;
  padding: 10px 20px;
  border-radius: 999px;
  text-decoration: none;
  transition: transform .12s, box-shadow .2s;
  box-shadow: 0 4px 0 #6a8a1f, 0 8px 22px rgba(196,255,61,.35);
}
.tp-unavailable a:hover{ transform: translateY(-1px); }
.tp-unavailable a:active{ transform: translateY(2px); box-shadow: 0 2px 0 #6a8a1f, 0 4px 12px rgba(196,255,61,.4); }

/* ── RESPONSIVE ────────────────────────────────────────────── */
.tf-item{margin-bottom:14px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line);}
.tf-text{font-size:14px;color:var(--ink);margin-bottom:10px;line-height:1.4;}
.tf-btns{display:flex;gap:8px;}
.tf-btn{flex:1;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;
  background:rgba(255,255,255,.05);border:1px solid var(--line-2);color:var(--ink-2);
  cursor:pointer;transition:background .15s,border-color .15s,color .15s;}
.tf-btn:hover{background:rgba(255,255,255,.09);color:var(--ink);}
.tf-btn.selected{background:rgba(124,58,237,.18);border-color:#7c3aed;color:#c4b5fd;}
.tf-btn.correct{background:rgba(16,185,129,.15)!important;border-color:#10b981!important;color:#6ee7b7!important;}
.tf-btn.wrong{background:rgba(239,68,68,.15)!important;border-color:#ef4444!important;color:#fca5a5!important;}
.tf-ok{border-color:rgba(16,185,129,.3)!important;}
.tf-bad{border-color:rgba(239,68,68,.2)!important;}
.tf-expl{font-size:11.5px;color:rgba(255,255,255,.45);margin-top:8px;
  line-height:1.4;display:none;padding-top:6px;border-top:1px solid var(--line);}
/* game-mode compact truefalse */
.tp-page.game-mode .tf-item{margin-bottom:8px;padding:10px 12px;}
.tp-page.game-mode .tf-text{font-size:13px;margin-bottom:8px;}
.tp-page.game-mode .tf-btn{padding:7px 10px;font-size:12px;}

/* ── GAME MODE — layout lado a lado sin scroll ─────────── */
.tp-page.game-mode{
  position:fixed;top:0;left:76px;right:0;bottom:0;
  display:flex;flex-direction:row;overflow:hidden;
  padding-left:0;min-height:unset;
}
.tp-page.game-mode .tp-topbar{display:none;}
/* ── left panel: hero → side info ── */
.tp-page.game-mode .tp-hero{
  position:relative;
  width:260px;min-width:260px;flex-shrink:0;
  margin:0;border-radius:0;
  min-height:unset;height:100%;
  flex-direction:column;justify-content:flex-start;
  border:none;border-right:1px solid rgba(255,255,255,.07);
  overflow:hidden;
}
.tp-page.game-mode .tp-hero-content{
  padding:20px 18px 18px;
  flex:1;display:flex;flex-direction:column;gap:10px;
  overflow:hidden;
}
.tp-page.game-mode .tp-title{font-size:1.4rem;line-height:1.1;}
.tp-page.game-mode .tp-sub{font-size:11px;color:rgba(255,255,255,.45);margin:0;}
.tp-page.game-mode .tp-stats{gap:7px;}
.tp-page.game-mode .tp-stat{padding:9px 11px;gap:7px;}
.tp-page.game-mode .tp-stat-val{font-size:14px;}
.tp-page.game-mode .tp-stat-lbl{font-size:9px;}
/* ── right panel: game area fills 100% ── */
.tp-page.game-mode .tp-body{
  flex:1;min-width:0;padding:0;max-width:none;
  height:100%;overflow:hidden;
  display:flex;flex-direction:column;
}
.tp-page.game-mode .gm-steps{display:none;}
/* ── body pad + card fill full height ── */
.gm-body-pad{
  flex:1;min-height:0;overflow:hidden;
  padding:16px 60px 16px 28px;
  display:flex;flex-direction:column;
}
.tp-page.game-mode .gm-card{
  flex:1;min-height:0;
  display:flex;flex-direction:column;
  padding:22px 26px 18px;
}
.tp-page.game-mode .gm-type-tag{margin-bottom:12px;}
/* inner game content — fills remaining space, scrolls only as last resort */
.gm-inner{
  flex:1;min-height:0;
  overflow:hidden;
  display:flex;flex-direction:column;
  justify-content:space-between;
}
.tp-page.game-mode .gm-feedback{flex-shrink:0;}
.tp-page.game-mode .gm-footer{margin-top:12px;padding-top:12px;flex-shrink:0;}
/* ── compact translate game in game-mode — 1 fila por pronombre ── */
.tp-page.game-mode .gm-instruction{font-size:12px;margin-bottom:10px;line-height:1.4;}
.tp-page.game-mode .tr-item{
  display:flex;align-items:center;gap:10px;
  flex:1;margin-bottom:0;
}
.tr-pager{
  font-family:var(--font-mono);font-size:10px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin-bottom:10px;opacity:.7;
}
.tp-page.game-mode .tr-src{
  width:72px;min-width:72px;flex-shrink:0;
  font-size:15px;margin-bottom:0;
}
.tp-page.game-mode .tr-opts{
  flex:1;grid-template-columns:repeat(4,1fr);gap:6px;
}
.tp-page.game-mode .tr-opt{
  padding:7px 6px;font-size:12px;
  border-radius:9px;text-align:center;
}
/* ── compact otros juegos en game-mode ── */
.tp-page.game-mode .gm-q{font-size:1.1rem;margin-bottom:14px;}
.tp-page.game-mode .mc-opt{padding:11px 14px;font-size:13.5px;}
.tp-page.game-mode .mc-grid{gap:8px;}
/* fill */
.tp-page.game-mode .fb-group{margin-bottom:14px;}
.tp-page.game-mode .fb-bank{gap:6px;margin-top:8px;}
.tp-page.game-mode .fb-word{padding:6px 10px;font-size:13px;}
/* order */
.tp-page.game-mode .wo-group{margin-bottom:14px;}
.tp-page.game-mode .wo-tile{padding:6px 10px;font-size:13px;}
/* fix */
.tp-page.game-mode .fx-sent{margin-bottom:12px;}
/* match */
.tp-page.game-mode .match-item{padding:9px 12px;font-size:13px;}
/* scramble */
.tp-page.game-mode .scr-group{margin-bottom:12px;}
.tp-page.game-mode .scr-tile{padding:6px 10px;font-size:13px;}
/* ── side panel extras ── */
.gm-side-back{flex-shrink:0;margin-bottom:4px;}
.gm-side-dots{
  display:flex;gap:5px;flex-wrap:wrap;
  margin-top:auto;padding-top:14px;
}
.gm-side-dot{
  height:4px;flex:1;min-width:14px;border-radius:2px;
  background:rgba(255,255,255,.12);transition:background .3s;
}
.gm-side-dot.done{background:var(--good);}
.gm-side-dot.active{background:var(--accent);box-shadow:0 0 6px rgba(196,255,61,.45);}
/* ── mobile ── */
@media(max-width:680px){
  .tp-page.game-mode{left:0;}
  .tp-page.game-mode .tp-hero{display:none;}
  .tp-page.game-mode .gm-steps{display:flex !important;}
  .gm-body-pad{padding:14px 16px 14px;}
}

@media(max-width:900px){
  .ex-item{
    grid-template-columns: 32px 48px 1fr auto;
  }
  .ex-status{ display: none; }
}
@media(max-width:768px){
  .tp-page{ padding-left: 0; }
  .tp-topbar{ padding: 14px 16px; }
  .tp-hero{ margin: 4px 16px 28px; border-radius: 18px; }
  .tp-hero-content{ padding: 32px 22px 24px; }
  .tp-body{ padding: 0 16px 80px; }
  .tp-title{ font-size: 2.2rem; }
  .tp-section-label{ font-size: 1.2rem; }
  .ex-item{
    grid-template-columns: 28px 44px 1fr auto;
    gap: 10px;
    padding: 12px 12px 12px 10px;
  }
  .ex-icon{ width: 44px; height: 44px; }
}

/* ═══════════════════════════════════════════════════════════
   GAME ENGINE STYLES
   ═══════════════════════════════════════════════════════════ */

/* Step track */
.gm-steps{display:flex;align-items:center;gap:6px;padding:0 40px 0;margin-bottom:22px;}
.gm-step{height:5px;flex:1;border-radius:999px;background:var(--line-3);transition:background .3s,flex .3s;}
.gm-step.active{background:var(--accent);flex:2;box-shadow:0 0 8px rgba(196,255,61,.45);}
.gm-step.done{background:var(--good);}

/* Game card */
.gm-card{
  background:linear-gradient(180deg,var(--card-2),var(--card));
  border:1px solid var(--line-2);border-radius:20px;padding:32px 36px;
  position:relative;overflow:hidden;
}
.gm-card::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(196,255,61,.025) 1px,transparent 1px);
  background-size:22px 22px;
}
.gm-type-tag{
  display:inline-flex;align-items:center;gap:7px;
  font-family:var(--font-mono);font-size:10px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:20px;
}
.gm-type-tag svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.gm-q{
  font-family:var(--font-display);font-size:1.3rem;font-weight:700;
  letter-spacing:-.02em;color:var(--ink);line-height:1.35;margin-bottom:26px;
}
.gm-instruction{font-size:13.5px;color:var(--ink-3);margin-bottom:22px;line-height:1.55;}

/* ── Multiple choice ────────────────────────────────────── */
.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mc-opt{
  padding:15px 16px;border-radius:14px;
  background:rgba(255,255,255,.04);border:1.5px solid var(--line-2);
  font-family:var(--font-body);font-size:14.5px;font-weight:600;color:var(--ink-2);
  cursor:pointer;text-align:left;transition:all .18s;
  display:flex;align-items:center;gap:12px;
}
.mc-opt:hover{background:rgba(255,255,255,.07);border-color:var(--line-3);color:var(--ink);}
.mc-opt-letter{
  width:28px;height:28px;border-radius:8px;flex-shrink:0;
  background:rgba(255,255,255,.06);border:1px solid var(--line-3);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--muted);
}
.mc-opt.sel{background:rgba(196,255,61,.08);border-color:rgba(196,255,61,.35);color:var(--ink);}
.mc-opt.sel .mc-opt-letter{background:rgba(196,255,61,.15);border-color:rgba(196,255,61,.4);color:var(--accent);}
.mc-opt.correct{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.4);color:var(--good);pointer-events:none;}
.mc-opt.correct .mc-opt-letter{background:rgba(34,197,94,.2);border-color:rgba(34,197,94,.4);color:var(--good);}
.mc-opt.wrong{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.35);color:var(--rose);pointer-events:none;}
.mc-opt.wrong .mc-opt-letter{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:var(--rose);}

/* ── Matching ───────────────────────────────────────────── */
.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;}
.match-col{display:flex;flex-direction:column;gap:7px;}
.match-col-lbl{font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
.match-item{
  padding:12px 16px;border-radius:12px;
  background:rgba(255,255,255,.04);border:1.5px solid var(--line-2);
  font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--ink-2);
  cursor:pointer;transition:all .15s;user-select:none;
}
.match-item:hover{background:rgba(255,255,255,.07);color:var(--ink);}
.match-item.sel{background:rgba(196,255,61,.1);border-color:rgba(196,255,61,.4);color:var(--accent);}
.match-item.matched{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:var(--good);pointer-events:none;opacity:.8;}
.match-item.shake{animation:gmShake .36s ease;}
@keyframes gmShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}90%{transform:translateX(-4px);}}

/* ── Fill blank ─────────────────────────────────────────── */
.fb-group{margin-bottom:22px;}
.fb-group+.fb-group{border-top:1px solid var(--line);padding-top:22px;}
.fb-row{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.fb-num{font-family:var(--font-mono);font-size:10.5px;font-weight:700;color:var(--muted);}
.fb-text{font-size:17px;font-weight:600;color:var(--ink);line-height:1.6;}
.fb-blank{
  display:inline-block;min-width:72px;height:34px;line-height:34px;
  border-bottom:2px solid var(--accent);padding:0 12px;
  font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--accent);
  text-align:center;background:rgba(196,255,61,.05);border-radius:6px 6px 0 0;
  transition:all .2s;cursor:pointer;vertical-align:middle;
}
.fb-blank.filled{color:var(--accent);border-bottom-color:rgba(196,255,61,.6);}
.fb-blank.correct{border-bottom-color:var(--good);color:var(--good);background:rgba(34,197,94,.08);}
.fb-blank.wrong{border-bottom-color:var(--rose);color:var(--rose);background:rgba(251,113,133,.07);animation:gmShake .36s;}
.fb-bank{display:flex;flex-wrap:wrap;gap:7px;}
.fb-word{
  padding:8px 16px;border-radius:10px;
  background:rgba(255,255,255,.05);border:1.5px solid var(--line-2);
  font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--ink);
  cursor:pointer;transition:all .15s;user-select:none;
}
.fb-word:hover{background:rgba(196,255,61,.1);border-color:rgba(196,255,61,.3);color:var(--accent);}
.fb-word.used{opacity:.28;pointer-events:none;}

/* ── Word order ─────────────────────────────────────────── */
.wo-group{margin-bottom:26px;}
.wo-group+.wo-group{border-top:1px solid var(--line);padding-top:26px;}
.wo-lbl{font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.wo-zone{
  display:flex;flex-wrap:wrap;gap:8px;min-height:50px;
  padding:12px 14px;border-radius:12px;
}
.wo-bank-zone{background:rgba(255,255,255,.025);border:1px dashed var(--line-3);}
.wo-ans-zone{background:rgba(196,255,61,.03);border:1.5px dashed rgba(196,255,61,.2);}
.wo-tile{
  padding:9px 15px;border-radius:10px;
  background:rgba(255,255,255,.06);border:1.5px solid var(--line-2);
  font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--ink);
  cursor:pointer;transition:all .15s;user-select:none;
}
.wo-tile:hover{background:rgba(255,255,255,.1);transform:translateY(-1px);}
.wo-ans-zone .wo-tile{background:rgba(196,255,61,.1);border-color:rgba(196,255,61,.25);color:var(--accent);}
.wo-tile.ok{background:rgba(34,197,94,.1)!important;border-color:rgba(34,197,94,.35)!important;color:var(--good)!important;pointer-events:none;}
.wo-tile.bad{background:rgba(239,68,68,.08)!important;border-color:rgba(239,68,68,.3)!important;color:var(--rose)!important;pointer-events:none;}

/* ── Error fix ──────────────────────────────────────────── */
.ef-group{margin-bottom:26px;}
.ef-group+.ef-group{border-top:1px solid var(--line);padding-top:26px;}
.ef-sentence{font-size:18px;font-weight:600;color:var(--ink);line-height:1.8;margin-bottom:12px;}
.ef-word-btn{
  display:inline;padding:2px 7px;border-radius:6px;
  font-size:inherit;font-weight:inherit;font-family:inherit;
  background:transparent;border:1.5px solid transparent;cursor:pointer;color:inherit;
  transition:all .15s;
}
.ef-word-btn:hover{background:rgba(255,255,255,.06);border-color:var(--line-3);}
.ef-word-btn.hint{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.3);color:var(--warn);}
.ef-word-btn.selected{background:rgba(251,191,36,.14);border-color:var(--warn);color:var(--warn);}
.ef-word-btn.fixed{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.4);color:var(--good);pointer-events:none;}
.ef-choices{display:flex;flex-wrap:wrap;gap:8px;opacity:0;pointer-events:none;transition:opacity .25s;}
.ef-choices.show{opacity:1;pointer-events:all;}
.ef-choice{
  padding:8px 17px;border-radius:10px;
  background:rgba(255,255,255,.05);border:1.5px solid var(--line-2);
  font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--ink);
  cursor:pointer;transition:all .15s;
}
.ef-choice:hover{background:rgba(196,255,61,.1);border-color:rgba(196,255,61,.3);color:var(--accent);}

/* ── Feedback banner ────────────────────────────────────── */
.gm-feedback{
  display:flex;align-items:center;gap:12px;padding:14px 18px;
  border-radius:12px;margin-top:20px;opacity:0;transition:opacity .25s;pointer-events:none;
}
.gm-feedback.show{opacity:1;}
.gm-feedback.ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);}
.gm-feedback.bad{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);}
.gm-fb-ico{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.gm-feedback.ok .gm-fb-ico{background:rgba(34,197,94,.2);color:var(--good);}
.gm-feedback.bad .gm-fb-ico{background:rgba(239,68,68,.14);color:var(--rose);}
.gm-fb-ico svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.gm-fb-txt{font-size:13.5px;font-weight:600;}
.gm-feedback.ok .gm-fb-txt{color:var(--good);}
.gm-feedback.bad .gm-fb-txt{color:var(--rose);}

/* ── Footer ─────────────────────────────────────────────── */
.gm-footer{display:flex;align-items:center;justify-content:space-between;margin-top:26px;padding-top:18px;border-top:1px solid var(--line);}
.gm-xp-tag{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--muted);}
.gm-xp-tag b{color:var(--accent);}
.gm-btn{
  display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:999px;
  font-family:var(--font-body);font-size:14px;font-weight:700;cursor:pointer;
  transition:transform .12s,box-shadow .2s;border:none;
}
.gm-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.gm-btn-verify{background:rgba(255,255,255,.06);border:1.5px solid var(--line-2);color:var(--ink-2);}
.gm-btn-verify:hover{border-color:var(--line-3);color:var(--ink);}
.gm-btn-next{background:linear-gradient(180deg,var(--accent),var(--accent-d));color:#0a0a0a;box-shadow:0 4px 0 #6a8a1f,0 8px 20px rgba(196,255,61,.28);}
.gm-btn-next:hover{transform:translateY(-1px);box-shadow:0 5px 0 #6a8a1f,0 10px 28px rgba(196,255,61,.38);}
.gm-btn-next:active{transform:translateY(2px);box-shadow:0 2px 0 #6a8a1f;}

/* ── Results ────────────────────────────────────────────── */
.gm-results{padding:48px 36px;text-align:center;}
.gm-results-star{width:80px;height:80px;border-radius:24px;background:rgba(196,255,61,.1);border:1.5px solid rgba(196,255,61,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;}
.gm-results-star svg{width:36px;height:36px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.gm-results-title{font-family:var(--font-display);font-size:2.2rem;font-weight:800;letter-spacing:-.03em;color:#fff;margin-bottom:8px;}
.gm-results-sub{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:32px;}
.gm-results-stats{display:flex;justify-content:center;gap:14px;margin-bottom:32px;flex-wrap:wrap;}
.gm-rs{padding:18px 22px;background:rgba(255,255,255,.04);border:1px solid var(--line-2);border-radius:16px;text-align:center;min-width:90px;}
.gm-rs-val{font-family:var(--font-display);font-size:2rem;font-weight:800;color:var(--accent);}
.gm-rs-lbl{font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px;}
.gm-results-btns{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;}
.gm-btn-ghost{padding:12px 22px;border-radius:999px;background:rgba(255,255,255,.06);border:1.5px solid var(--line-2);font-family:var(--font-body);font-size:14px;font-weight:700;color:var(--ink-2);cursor:pointer;transition:background .15s;}
.gm-btn-ghost:hover{background:rgba(255,255,255,.1);}

@media(max-width:600px){
  .mc-grid{grid-template-columns:1fr;}
  .match-cols{grid-template-columns:1fr;}
  .gm-card{padding:22px 18px;}
  .gm-steps{padding:0 16px;}
}

/* -- truefalse ---------------------------------------------- */
let _tfSel={};
let _tfStmts=[];
function buildTrueFalse(g){
  _tfSel={};
  _tfStmts=shuffle(g.stmts.slice());
  return'<p class="gm-instruction">'+g.instr+'</p>'+
    _tfStmts.map(function(s,i){
      return'<div class="tf-item" id="tfItem'+i+'">'+
        '<div class="tf-text">'+s.text+'</div>'+
        '<div class="tf-btns">'+
          '<button class="tf-btn tf-v" data-i="'+i+'" onclick="_tfClick('+i+',true)">✓ Verdadero</button>'+
          '<button class="tf-btn tf-f" data-i="'+i+'" onclick="_tfClick('+i+',false)">✗ Falso</button>'+
        '</div>'+
        '<div class="tf-expl" id="tfExpl'+i+'"></div>'+
      '</div>';
    }).join('');
}
window._tfClick=function(i,val){
  if(STATE.checked)return;
  _tfSel[i]=val;
  ISA('[data-i="'+i+'"].tf-btn').forEach(function(btn){
    btn.classList.toggle('selected',
      (btn.classList.contains('tf-v')&&val===true)||(btn.classList.contains('tf-f')&&val===false));
  });
};

/* -- translate ------------------------------------------------ */
.tr-item{margin-bottom:22px;}
.tr-src{font-size:22px;font-weight:800;color:var(--ink);margin-bottom:12px;letter-spacing:.5px;}
.tr-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tr-opt{padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.04);
  border:1.5px solid var(--line-2);font-size:14px;font-weight:600;color:var(--ink-2);
  cursor:pointer;text-align:center;transition:all .18s;}
.tr-opt:hover{background:rgba(255,255,255,.07);border-color:var(--line-3);color:var(--ink);}
.tr-opt.selected{background:rgba(124,58,237,.18);border-color:#7c3aed;color:#c4b5fd;}
.tr-opt.correct{background:rgba(16,185,129,.15)!important;border-color:#10b981!important;color:#6ee7b7!important;}
.tr-opt.wrong{background:rgba(239,68,68,.15)!important;border-color:#ef4444!important;color:#fca5a5!important;}

/* -- scramble ------------------------------------------------- */
.scr-item{margin-bottom:26px;padding:18px;background:rgba(255,255,255,.03);border-radius:16px;border:1px solid var(--line-2);}
.scr-hint{font-size:12px;color:var(--ink-3);margin-bottom:12px;opacity:.8;}
.scr-answer{min-height:48px;background:rgba(255,255,255,.04);border-radius:10px;border:1.5px dashed var(--line-3);

<script>

/* ── state ─────────────────────────────────────────────── */
let STATE={view:'list',topic:null,step:0,score:0,checked:false};

const heroBg  = I('tpHeroBg');

/* ════════════════════════════════════════════════════════

function renderList(){

      </div>
    </div>
    <div class="tp-progress"><div class="tp-progress-bar"><div class="tp-progress-fill" style="width:0%"></div></div></div>`;

  /* body — topic list */

    '<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>',

    '<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>',
    '<svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>',
    '<svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>',

/* ════════════════════════════════════════════════════════
   GAME VIEW
   ════════════════════════════════════════════════════════ */
function enterTopic(t){
  STATE={view:'game',topic:t,step:0,score:0,checked:false};
  _trPage=0;
  const rc=RM[t.rank]||'#cd7f32';
  document.documentElement.style.setProperty('--rank-color',rc);
  document.title=t.sub+' — Aura Languages';
  document.querySelector('.tp-page').classList.add('game-mode');
  crumb.innerHTML=`${t.rank} · ${t.cefr} · <b>${t.sub}</b>`;
  backBtn.href='#';
  backBtn.querySelector('span').textContent='Volver a temas';
  backBtn.onclick=e=>{e.preventDefault();renderList();};

  /* hero → side panel */
  heroBg.querySelectorAll('img').forEach(e=>e.remove());
  const hImg=document.createElement('img');
  hImg.src=t.img;hImg.alt='';hImg.loading='eager';hImg.onerror=()=>hImg.remove();
  heroBg.appendChild(hImg);

  const _raw=getGames(t.id);
  _gameSeq=_raw?shuffle(_raw.slice()):null;
  const games=_gameSeq;
  const totalXp=games?games.reduce((s,g)=>s+g.xp,0):t.xp;
  const lines=t.title.split('\n');
  const dotsHtml=games?games.map((_,i)=>`<div class="gm-side-dot active"></div>`).join(''):'';
  heroCtx.innerHTML=`
    <div class="gm-side-back">
      <button class="tp-back" id="gmBackBtn" type="button">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        <span>Temas</span>
      </button>
    </div>
    <div class="tp-hero-pills">
      <span class="tp-pill tp-pill-rank"><span class="tp-pill-dot"></span>${t.rank}</span>
      <span class="tp-pill tp-pill-cefr" style="background:${rc}">${t.cefr}</span>
    </div>
    <h1 class="tp-title">${lines.join('<br>')}</h1>
    <p class="tp-sub">${t.sub}</p>
    <div class="tp-stats">
      <div class="tp-stat s-accent">
        <div class="tp-stat-ico"><svg viewBox="0 0 24 24"><polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polyline></svg></div>
        <div class="tp-stat-text"><div class="tp-stat-val">+${totalXp} XP</div><div class="tp-stat-lbl">Recompensa</div></div>
      </div>
      <div class="tp-stat">
        <div class="tp-stat-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg></div>
        <div class="tp-stat-text"><div class="tp-stat-val">${games?games.length:t.steps} pasos</div><div class="tp-stat-lbl">Secuencia</div></div>
      </div>
    </div>
    <div class="gm-side-dots" id="gmSideDots">${dotsHtml}</div>`;

  const _gmBack=I('gmBackBtn');
  if(_gmBack)_gmBack.addEventListener('click',function(){renderList();});

  renderStep();
}

function getGames(id){ return id===1?GAMES1:id===2?GAMES2:null; }

function renderStep(){
  const games=_gameSeq;
  if(!games){
    body.innerHTML=`<div class="tp-unavailable"><div class="tp-unavailable-ico"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div><h2>Próximamente</h2><p>Los juegos de este tema estarán disponibles pronto.</p><a href="#" onclick="renderList();return false;">← Volver a temas</a></div>`;
    return;
  }
  STATE.checked=false;
  const g=games[STATE.step];

  /* steps track */
  /* update side panel dots */
  const _sd=I('gmSideDots');
  if(_sd){
    _sd.innerHTML=games.map((_,i)=>`<div class="gm-side-dot${i<STATE.step?' done':i===STATE.step?' active':''}"></div>`).join('');
  }
  const stepsHtml=games.map((_,i)=>{
    let c='gm-step';
    if(i<STATE.step)c+=' done';
    else if(i===STATE.step)c+=' active';
    return`<div class="${c}"></div>`;
  }).join('');

  const STEP_ICONS={
    mc:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg>`,
    match:`<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.72-1.71"></path></svg>`,
    fill:`<svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 1 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>`,
    order:`<svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="15" y2="12"></line><line x1="3" y1="18" x2="9" y2="18"></line></svg>`,
    fix:`<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>`,
    translate:`<svg viewBox="0 0 24 24"><path d="M5 8l6 6"></path><path d="M4 14l6-6 2-3"></path><path d="M2 5h12"></path><path d="M7 2h1"></path><path d="M22 22l-5-10-5 10"></path><path d="M14 18h6"></path></svg>`,
    scramble:`<svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>`,
    truefalse:`<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>`,
  };

  let inner='';
  if(g.id==='mc')    inner=buildMC(g);
  if(g.id==='match') inner=buildMatch(g);
  if(g.id==='fill')  inner=buildFill(g);
  if(g.id==='order') inner=buildOrder(g);
  if(g.id==='fix')       inner=buildFix(g);
  if(g.id==='translate') inner=buildTranslate(g);
  if(g.id==='scramble')  inner=buildScramble(g);
  if(g.id==='truefalse') inner=buildTrueFalse(g);

  const verifyStyle=g.id==='match'?'display:none':'';
  body.innerHTML=`
    <div class="gm-steps">${stepsHtml}</div>
    <div class="gm-body-pad">
      <div class="gm-card">
        <div class="gm-type-tag">${STEP_ICONS[g.id]||''}Paso ${STATE.step+1} de ${games.length} · ${g.label}</div>
        <div class="gm-inner">${inner}</div>
        <div class="gm-feedback" id="gmFB">
          <div class="gm-fb-ico" id="gmFBIco"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
          <div class="gm-fb-txt" id="gmFBTxt"></div>
        </div>
        <div class="gm-footer">
          <div class="gm-xp-tag">XP acumulado: <b id="gmXP">${STATE.score}</b></div>
          <div style="display:flex;gap:10px;align-items:center">
            <button class="gm-btn gm-btn-verify" id="gmVerify" style="${verifyStyle}" onclick="gmVerify()">
              Verificar <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </button>
            <button class="gm-btn gm-btn-next" id="gmNext" style="display:none" onclick="gmNext()">
              ${STATE.step<games.length-1?'Continuar':'Ver resultados'}
              <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
          </div>
        </div>
      </div>
    </div>`;
}

/* ── build functions ──────────────────────────────────── */
function buildMC(g){
  const L=['A','B','C','D'];
  const _ans=g.opts[g.correct];
  const opts=shuffle(g.opts.slice());
  _mcCorrect=opts.indexOf(_ans);
  return`<div class="gm-q">${g.q}</div>
    <div class="mc-grid">${opts.map((o,i)=>`<button class="mc-opt" id="mc${i}" onclick="_mcSel(${i})">`+
      `<span class="mc-opt-letter">${L[i]}</span>${o}</button>`).join('')}</div>`;
}

function buildMatch(g){
  const right=shuffle(g.pairs.map((p,i)=>({t:p[1],i})));
  return`<p class="gm-instruction">${g.instr}</p>
    <div class="match-cols">
      <div class="match-col"><div class="match-col-lbl">Pronombres</div>
        ${g.pairs.map((p,i)=>`<div class="match-item" id="mL${i}" data-side="L" data-i="${i}" onclick="_mClick(this)">${p[0]}</div>`).join('')}
      </div>
      <div class="match-col"><div class="match-col-lbl">Significado en español</div>
        ${right.map(r=>`<div class="match-item" id="mR${r.i}" data-side="R" data-i="${r.i}" onclick="_mClick(this)">${r.t}</div>`).join('')}
      </div>
    </div>`;
}

function buildFill(g){
  const sents=shuffle(g.sents.slice());
  return`<p class="gm-instruction">${g.instr}</p>`+
    sents.map((s,i)=>`<div class="fb-group">
      <div class="fb-row">
        <span class="fb-num">${i+1}.</span>
        <span class="fb-text">${s.pre}<span class="fb-blank" id="fbB${i}" data-ans="${s.ans}" data-i="${i}" onclick="_fbClear(${i})">___</span>${s.post}</span>
      </div>
      <div class="fb-bank" id="fbBnk${i}">
        ${shuffle([...s.bank]).map(w=>`<div class="fb-word" data-w="${w}" onclick="_fbPick(${i},this)">${w}</div>`).join('')}
      </div>
    </div>`).join('');
}

function buildOrder(g){
  _orderSents=shuffle(g.sents.slice());
  return`<p class="gm-instruction">${g.instr}</p>`+
    _orderSents.map((s,i)=>`<div class="wo-group" id="woG${i}">
      <div class="wo-lbl">Tu respuesta</div>
      <div class="wo-zone wo-ans-zone" id="woA${i}"></div>
      <div class="wo-lbl" style="margin-top:10px">Palabras</div>
      <div class="wo-zone wo-bank-zone" id="woB${i}">
        ${shuffle([...s.words]).map(w=>`<div class="wo-tile" data-w="${w}" onclick="_woClick(this,${i},'b')">${w}</div>`).join('')}
      </div>
    </div>`).join('');
}

function buildFix(g){
  _fixSents=shuffle(g.sents.slice());
  return`<p class="gm-instruction">${g.instr}</p>`+
    _fixSents.map((s,si)=>`<div class="ef-group" id="efG${si}">
      <div class="ef-sentence">
        ${s.words.map((w,wi)=>`<button class="ef-word-btn${wi===s.wi?' hint':''}" data-si="${si}" data-wi="${wi}" onclick="_efClick(${si},${wi})">${w}</button> `).join('')}
      </div>
      <div class="ef-choices" id="efC${si}">
        ${s.choices.map(c=>`<div class="ef-choice" onclick="_efPick(${si},'${c}','${s.correct}')">${c}</div>`).join('')}
      </div>
    </div>`).join('');
}

/* -- translate ------------------------------------------------ */
let _trSel={};
let _trPage=0;
const _TR_PAGE=3;
function buildTranslate(g){
  _trSel={};
  _trItems=shuffle(g.items.slice());
  return _renderTrPage(g);
}
function _renderTrPage(g){
  const start=_trPage*_TR_PAGE;
  const items=_trItems.slice(start,start+_TR_PAGE);
  const pages=Math.ceil(_trItems.length/_TR_PAGE);
  const pageTag=pages>1?'<div class="tr-pager">Grupo '+(_trPage+1)+' de '+pages+'</div>':'';
  return'<p class="gm-instruction">'+g.instr+'</p>'+pageTag+
    items.map(function(it,i){
      const gi=start+i;
      return'<div class="tr-item" id="trItem'+gi+'">'+
        '<div class="tr-src">'+it.src+'</div>'+
        '<div class="tr-opts">'+
          it.opts.map(function(o,oi){
            return'<button class="tr-opt" data-i="'+gi+'" data-oi="'+oi+'" onclick="_trClick('+gi+','+oi+')">'+o+'</button>';
          }).join('')+
        '</div></div>';
    }).join('');
}
window._trClick=function(i,oi){
  if(STATE.checked)return;
  _trSel[i]=oi;
  ISA('[data-i="'+i+'"].tr-opt').forEach(function(el,idx){el.classList.toggle('selected',idx===oi);});
};

/* -- scramble ------------------------------------------------- */
function buildScramble(g){
  _scrWords=shuffle(g.words.slice());
  return'<p class="gm-instruction">'+g.instr+'</p>'+
    _scrWords.map(function(w,i){
      return'<div class="scr-item" id="scrItem'+i+'">'+
        '<div class="scr-hint">&#128161; '+w.hint+'</div>'+
        '<div class="scr-answer" id="scrAns'+i+'"></div>'+
        '<div class="scr-bank" id="scrBank'+i+'">'+
          w.scrambled.map(function(l,li){
            return'<button class="scr-tile" data-li="'+li+'" onclick="_scrPlace('+i+','+li+',this)">'+l+'</button>';
          }).join('')+
        '</div></div>';
    }).join('');
}
window._scrPlace=function(wi,li,btn){
  if(STATE.checked)return;
  var ans=I('scrAns'+wi);
  var tile=document.createElement('button');
  tile.className='scr-tile placed';
  tile.textContent=btn.textContent;
  tile.dataset.li=li;
  tile.onclick=function(){_scrRemove(wi,li,this);};
  ans.appendChild(tile);
  btn.style.visibility='hidden';btn.disabled=true;
};
window._scrRemove=function(wi,li,tile){
  if(STATE.checked)return;
  var orig=I('scrBank'+wi).querySelector('[data-li="'+li+'"]');
  if(orig){orig.style.visibility='visible';orig.disabled=false;}
  tile.remove();
};

/* ── interaction handlers ─────────────────────────────── */
var _mcSel=null,_mSel=null,_mDone=0,_efDone={};
var _mcCorrect=0,_orderSents=[],_fixSents=[],_scrWords=[],_trItems=[];
var _gameSeq=[];

window._mcSel=function(i){
  if(STATE.checked)return;
  _mcSel=i;
  ISA('.mc-opt').forEach((el,j)=>{
    el.classList.toggle('sel',j===i);
    el.style.opacity=j===i?'1':'0.55';
  });
};

window._mClick=function(el){
  if(el.classList.contains('matched'))return;
  const side=el.dataset.side;
  if(!_mSel){
    ISA('.match-item').forEach(e=>e.classList.remove('sel'));
    el.classList.add('sel');_mSel=el;return;
  }
  if(_mSel.dataset.side===side){
    ISA('.match-item').forEach(e=>e.classList.remove('sel'));
    el.classList.add('sel');_mSel=el;return;
  }
  const ia=parseInt(_mSel.dataset.i),ib=parseInt(el.dataset.i);
  if(ia===ib){
    _mSel.classList.remove('sel');_mSel.classList.add('matched');
    el.classList.add('matched');_mDone++;_mSel=null;
    const tot=ISA('.match-item[data-side="L"]').length;
    if(_mDone>=tot){
      STATE.score+=30;STATE.checked=true;
      showFB(true,'¡Perfecto! Todos los pares correctos. +30 XP');
      showNext();
    }
  } else {
    el.classList.add('shake');_mSel.classList.add('shake');
    setTimeout(()=>{el.classList.remove('shake','sel');_mSel&&_mSel.classList.remove('shake','sel');_mSel=null;},500);
  }
};

window._fbPick=function(gi,wordEl){
  if(STATE.checked)return;
  const blank=I('fbB'+gi);
  if(blank.dataset.filled==='1')return;
  const w=wordEl.dataset.w;
  blank.textContent=w;blank.dataset.filled='1';
  wordEl.classList.add('used');
};

window._fbClear=function(gi){
  if(STATE.checked)return;
  const blank=I('fbB'+gi);
  if(blank.dataset.filled!=='1')return;
  const w=blank.textContent;
  blank.textContent='___';blank.dataset.filled='0';
  const bank=I('fbBnk'+gi);
  if(bank){const wd=bank.querySelector(`.fb-word[data-w="${w}"]`);if(wd)wd.classList.remove('used');}
};

window._woClick=function(el,gi,zone){
  if(STATE.checked)return;
  const w=el.dataset.w;el.remove();
  if(zone==='b'){
    const a=I('woA'+gi);
    const t=document.createElement('div');
    t.className='wo-tile';t.dataset.w=w;t.textContent=w;
    t.setAttribute('onclick',`_woClick(this,${gi},'a')`);
    a.appendChild(t);
  } else {
    const b=I('woB'+gi);
    const t=document.createElement('div');
    t.className='wo-tile';t.dataset.w=w;t.textContent=w;
    t.setAttribute('onclick',`_woClick(this,${gi},'b')`);
    b.appendChild(t);
  }
};

window._efClick=function(si,wi){
  const _games=_gameSeq;
  const g=_games[STATE.step];
  if(wi!==g.sents[si].wi)return;
  ISA(`[data-si="${si}"]`).forEach(b=>b.classList.remove('selected'));
  const btn=document.querySelector(`[data-si="${si}"][data-wi="${wi}"]`);
  if(btn)btn.classList.add('selected');
  const ch=I('efC'+si);if(ch)ch.classList.add('show');
};

window._efPick=function(si,chosen,correct){
  if(_efDone[si])return;
  const btn=document.querySelector(`[data-si="${si}"].selected`);
  if(!btn)return;
  if(chosen===correct){
    btn.textContent=chosen;btn.classList.remove('selected','hint');btn.classList.add('fixed');
    const ch=I('efC'+si);if(ch)ch.classList.remove('show');
    _efDone[si]=true;
  } else {
    btn.style.animation='none';
    requestAnimationFrame(()=>btn.style.animation='gmShake .36s ease');
  }
};

/* ── verify ───────────────────────────────────────────── */
window.gmVerify=function(){
  if(STATE.checked)return;
  const _games=_gameSeq;
  const g=_games[STATE.step];

  if(g.id==='mc'){
    if(_mcSel===null)return;
    const ok=_mcSel===_mcCorrect;
    ISA('.mc-opt').forEach((el,i)=>{
      el.style.opacity='1';
      if(i===_mcCorrect)el.classList.add('correct');
      else if(i===_mcSel&&!ok)el.classList.add('wrong');
    });
    STATE.checked=true;
    if(ok){STATE.score+=g.xp;showFB(true,`¡Correcto! +${g.xp} XP`);}
    else showFB(false,`La respuesta correcta era: ${g.opts[g.correct]}`);
    showNext();

  } else if(g.id==='fill'){
    let all=true;
    ISA('.fb-blank').forEach(b=>{if(b.dataset.filled!=='1')all=false;});
    if(!all)return;
    let cor=0;
    ISA('.fb-blank').forEach((b,i)=>{
      if(!b)return;
      if(b.textContent===b.dataset.ans){b.classList.add('correct');cor++;}
      else b.classList.add('wrong');
    });
    STATE.checked=true;
    const tot=ISA('.fb-blank').length;
    if(cor===tot){STATE.score+=g.xp;showFB(true,`¡Perfecto! +${g.xp} XP`);}
    else showFB(false,`${cor} de ${tot} correctos. Revisa los resaltados en rojo.`);
    showNext();

  } else if(g.id==='order'){
    let allOk=true;
    _orderSents.forEach((s,si)=>{
      const ansEl=I('woA'+si);if(!ansEl)return;
      const got=Array.from(ansEl.querySelectorAll('.wo-tile')).map(t=>t.textContent);
      const ok=got.join(' ')===s.ans.join(' ');
      if(!ok)allOk=false;
      ansEl.querySelectorAll('.wo-tile').forEach(t=>{t.classList.add(ok?'ok':'bad');});
      const bEl=I('woB'+si);
      if(bEl)bEl.querySelectorAll('.wo-tile').forEach(t=>{t.classList.add(ok?'ok':'bad');t.style.pointerEvents='none';});
    });
    STATE.checked=true;
    if(allOk){STATE.score+=g.xp;showFB(true,`¡Excelente! +${g.xp} XP`);}
    else showFB(false,'Alguna oración no está en el orden correcto.');
    showNext();

  } else if(g.id==='fix'){
    const all=_fixSents.every((_,i)=>_efDone[i]);
    if(!all)return;
    STATE.checked=true;STATE.score+=g.xp;
    showFB(true,`¡Todos los errores corregidos! +${g.xp} XP`);
    showNext();

  } else if(g.id==='translate'){
    const start=_trPage*_TR_PAGE;
    const pageItems=_trItems.slice(start,start+_TR_PAGE);
    if(Object.keys(_trSel).length<start+pageItems.length)return;
    let cor=0;
    pageItems.forEach((it,i)=>{
      const gi=start+i;
      const sel=_trSel[gi];
      ISA('[data-i="'+gi+'"].tr-opt').forEach((el,oi)=>{
        el.style.opacity='1';
        if(oi===it.correct)el.classList.add('correct');
        else if(oi===sel&&sel!==it.correct)el.classList.add('wrong');
      });
      if(sel===it.correct)cor++;
    });
    STATE.checked=true;
    const hasMore=(start+_TR_PAGE)<_trItems.length;
    if(cor===pageItems.length){
      if(hasMore){
        showFB(true,'¡Correcto! Siguiente grupo →');
        const nb=I('gmNext');nb.style.display='flex';
        nb.textContent='Siguiente grupo →';
        nb.onclick=function(){
          _trPage++;
          STATE.checked=false;
          I('gmFB').className='gm-feedback';
          I('gmVerify').style.display='flex';
          nb.style.display='none';
          nb.textContent='';nb.onclick=null;
          document.querySelector('.gm-inner').innerHTML=_renderTrPage(g); // uses _trItems
        };
      } else {
        STATE.score+=g.xp;
        showFB(true,`¡Perfecto! +${g.xp} XP`);
        showNext();
      }
    } else {
      showFB(false,`${cor} de ${pageItems.length} correctos.`);
    }

  } else if(g.id==='truefalse'){
    if(Object.keys(_tfSel).length<_tfStmts.length)return;
    let cor=0;
    _tfStmts.forEach((s,i)=>{
      const sel=_tfSel[i];
      const ok=(sel===s.ans);
      if(ok)cor++;
      const item=I('tfItem'+i);
      item.classList.add(ok?'tf-ok':'tf-bad');
      ISA('[data-i="'+i+'"].tf-btn').forEach(btn=>{
        const isV=btn.classList.contains('tf-v');
        if(isV===s.ans)btn.classList.add('correct');
        else if(isV!==s.ans&&sel!==s.ans&&
          ((isV&&sel===true)||(!isV&&sel===false)))btn.classList.add('wrong');
      });
      const expl=I('tfExpl'+i);
      if(expl){expl.textContent=s.expl;expl.style.display='block';}
    });
    STATE.checked=true;
    const tot=_tfStmts.length;
    if(cor===tot){STATE.score+=g.xp;showFB(true,`¡Perfecto! +${g.xp} XP`);}
    else showFB(false,`${cor} de ${tot} correctos.`);
    showNext();

  } else if(g.id==='scramble'){
    let allFilled=true;
    _scrWords.forEach((_,i)=>{const a=I('scrAns'+i);if(!a||a.querySelectorAll('.scr-tile').length===0)allFilled=false;});
    if(!allFilled)return;
    let allOk=true;
    _scrWords.forEach((w,i)=>{
      const placed=Array.from(I('scrAns'+i).querySelectorAll('.scr-tile')).map(t=>t.textContent);
      const ok=placed.join('')===w.ans;
      if(!ok)allOk=false;
      I('scrAns'+i).querySelectorAll('.scr-tile').forEach(t=>t.classList.add(ok?'ok':'bad'));
    });
    STATE.checked=true;
    if(allOk){STATE.score+=g.xp;showFB(true,`¡Perfecto! +${g.xp} XP`);}
    else showFB(false,'Alguna palabra no es correcta.');
    showNext();
  }
};

function showFB(ok,msg){
  const fb=I('gmFB'),ico=I('gmFBIco'),txt=I('gmFBTxt');
  if(!fb)return;
  fb.className='gm-feedback show '+(ok?'ok':'bad');
  ico.innerHTML=ok
    ?'<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>'
    :'<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
  txt.textContent=msg;
  const xpEl=I('gmXP');if(xpEl)xpEl.textContent=STATE.score;
}

function showNext(){
  const v=I('gmVerify'),n=I('gmNext');
  if(v)v.style.display='none';
  if(n)n.style.display='inline-flex';
}

window.gmNext=function(){
  _trPage=0;
  const games=_gameSeq;
  STATE.step++;
  _mcSel=null;_mSel=null;_mDone=0;_efDone={};
  if(STATE.step>=games.length)renderResults();
  else renderStep();
};

/* ── results ──────────────────────────────────────────── */
function renderResults(){
  const games=_gameSeq;
  const maxXp=games.reduce((s,g)=>s+g.xp,0);
  const pct=Math.round((STATE.score/maxXp)*100);
  const title=pct>=80?'¡Excelente trabajo!':pct>=50?'¡Buen esfuerzo!':'Sigue practicando';
  body.innerHTML=`
    <div class="gm-body-pad">
      <div class="gm-card gm-results">
        <div class="gm-results-star"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></div>
        <div class="gm-results-title">${title}</div>
        <div class="gm-results-sub">${STATE.topic.sub} · completado</div>
        <div class="gm-results-stats">
          <div class="gm-rs"><div class="gm-rs-val">+${STATE.score}</div><div class="gm-rs-lbl">XP Ganado</div></div>
          <div class="gm-rs"><div class="gm-rs-val">${pct}%</div><div class="gm-rs-lbl">Precisión</div></div>
          <div class="gm-rs"><div class="gm-rs-val">${games.length}</div><div class="gm-rs-lbl">Juegos</div></div>
        </div>
        <div class="gm-results-btns">
          <button class="gm-btn-ghost" onclick="renderList()">← Ver todos los temas</button>
          <button class="gm-btn gm-btn-next" onclick="renderList()">
            Siguiente tema <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
      </div>
    </div>`;
}

/* ── boot ─────────────────────────────────────────────── */
init();

/* Re-render list once profile is ready (role check needs profile loaded) */
window.addEventListener('aura:session', function(){
  if(STATE.view==='list') renderList();
}, {once:true});

try{if(window._aura&&window._aura.sb){
  window._aura.sb.auth.getSession().then(({data:{session}})=>{
    if(session&&window._aura.loadProfile)window._aura.loadProfile(session.user.id);
  });
}}catch(e){}

})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu Camino — Aura Languages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem('aura_theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}}());</script>
<link rel="stylesheet" href="aura-theme.css">
<link rel="stylesheet" href="progreso.css">
</head>
<body>

<div class="pt-wrap" id="ptWrap">

  <!-- HERO HEADER -->
  <div class="pt-head">
    <div class="pt-eyebrow">Roadmap · 50 temas · 6 rangos</div>
    <h1>Tu <em>Camino</em></h1>
    <p>Domina el idioma paso a paso. Cada tema que dominas desbloquea el siguiente nivel. Avanza por los rangos para desbloquear nuevos retos.</p>

    <!-- Overall progress -->
    <div class="pt-overall">
      <div class="pt-overall-left">
        <div class="pt-overall-label">Progreso general</div>
        <div class="pt-overall-bar"><div class="pt-overall-fill" id="overallFill" style="width:0%"></div></div>
      </div>
      <div class="pt-overall-right">
        <span class="pt-overall-pct"><span id="overallPct">0</span>%</span>
        <span class="pt-overall-of"><span id="overallNum">0</span> / 50</span>
      </div>
    </div>

    <!-- Stats row -->
    <div class="pt-stats">
      <div class="pt-stat s-accent">
        <div class="pt-stat-ico">
          <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        </div>
        <div><b id="statRank">—</b><small>Rango actual</small></div>
      </div>
      <div class="pt-stat">
        <div class="pt-stat-ico">
          <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        </div>
        <div><b id="statUnlocked">—</b><small>Desbloqueados</small></div>
      </div>
      <div class="pt-stat s-warn">
        <div class="pt-stat-ico">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>
        <div><b id="statLocked">—</b><small>Por desbloquear</small></div>
      </div>
    </div>
  </div>

  <!-- CONTENT (renderizado por progreso.js) -->
  <div id="ptContent"></div>

</div>

<!-- ═══ ORDEN DE SCRIPTS OBLIGATORIO ═══════════════════════ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="aura-supabase.js"></script>
<script src="aura-shell.js?v=1"></script>
<script src="progreso-data.js"></script>
<script src="progreso.js"></script>

</body>
</html>
